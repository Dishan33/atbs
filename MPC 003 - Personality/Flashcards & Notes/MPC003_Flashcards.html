<script>
const cards=[
// === FOUNDATIONS ===
{theme:"foundations",marks:"10",tier:"TIER 1",title:"Concept & Definition of Personality",
front:"Define personality. What are Allport's key components? Distinguish personality from character and temperament.",
back:`<p><strong>Allport (1937):</strong> "Personality is the <em>dynamic organisation within the person of the psychophysical systems</em> that determine the unique adjustments to one's environment."</p><p><strong>Two pillars:</strong> <strong>Individuality</strong> (Kluckhohn & Murray, 1953: "like all other persons, like some other persons, and like no other person") + <strong>Consistency</strong> (gives rise to traits).</p><p>Three characteristics: (1) distinguish individuals, (2) caused by <em>internal</em> factors, (3) have <em>organisation and structure</em>.</p><p><strong>Character</strong> = value judgements about moral/ethical behaviour. <strong>Temperament</strong> = inborn enduring characteristics. Both are parts of personality but NOT synonymous.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">dynamic organisation</span><span class="tag">psychophysical systems</span><span class="tag">individuality</span><span class="tag">consistency</span><span class="tag">character vs temperament</span><span class="tag">Allport (1937)</span><span class="tag">Kluckhohn & Murray (1953)</span></div>`},
{theme:"foundations",marks:"10",tier:"TIER 1",title:"Determinants of Personality Development",
front:"What are the three broad determinants of personality? Give the conceptual formula. What is Watson's extreme position?",
back:`<p><strong>Three determinants:</strong> (1) <strong>Biological</strong> (Physical) (2) <strong>Psychological</strong> (3) <strong>Environmental</strong>.</p><p><strong>Formula:</strong> Personality Development = Physical &times; Psychological &times; Environmental determinants (multiplicative).</p><p><strong>Biological factors set the boundary</strong> within which psychological and environmental factors shape personality.</p><p><strong>J.B. Watson</strong> (father of Behaviourism): claimed he could make a child into doctor, beggar, engineer, or thief — emphasising ONLY environment. Little support today.</p><p>Personality also develops through <em>imitation</em> and learning processes.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">biological/psychological/environmental</span><span class="tag">boundary concept</span><span class="tag">J.B. Watson</span><span class="tag">multiplicative formula</span><span class="tag">imitation</span></div>`},
{theme:"foundations",marks:"10",tier:"TIER 1",title:"Biological Determinants of Personality",
front:"What are the five biological/physical determinants? Describe body build, physical attractiveness, homeostasis, physical defects, and health.",
back:`<p><strong>(i) Body Build</strong> — Sheldon's somatotypes: ectomorph (thin, fast), endomorph (round, soft), mesomorph (muscular, strong). Affects self-concept.</p><p><strong>(ii) Physical Attractiveness</strong> — Brislin & Lewis (1968): attractive people judged more tolerantly; less likely to be punished; may be promoted sooner.</p><p><strong>(iii) Homeostasis</strong> — stable internal environment. When upset → personality affected directly (irritability, insomnia) and indirectly (reactions of others). High blood sugar → depression; lack of oxygen (anoxia) → emotional outbursts.</p><p><strong>(iv) Physical Defects</strong> — Adler's <em>organ inferiority</em>. Obesity → social handicap, inferiority feelings.</p><p><strong>(v) Health</strong> — good health = asset; poor health = liability. Illness in childhood leaves lasting changes (Martin & Vincent, 1960).</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">somatotypes</span><span class="tag">ectomorph/endomorph/mesomorph</span><span class="tag">homeostasis</span><span class="tag">anoxia</span><span class="tag">organ inferiority (Adler)</span><span class="tag">Brislin & Lewis (1968)</span></div>`},
{theme:"foundations",marks:"10",tier:"TIER 1",title:"Psychological Determinants of Personality",
front:"What are the psychological determinants? Describe intellectual, emotional, self-disclosure, and aspiration/achievement factors.",
back:`<p><strong>Intellectual:</strong> Bright people adjust better; <em>very superior</em> intelligence is unfavourable → negativism, intolerance, self-sufficiency.</p><p><strong>Emotional balance</strong> = "mental health insurance." Emotional deprivation → <em>emotional insecurity</em>. Excessive love → neurotic disorders (Freud); overprotective → immature/dependent (Strecker, 1956). <strong>Emotional catharsis</strong> = release of unexpressed emotions → restores homeostasis.</p><p><strong>Aspiration:</strong> positive, negative, realistic, unrealistic, remote, immediate. <em>Level of aspiration</em> = discrepancy between achieved and hoped-for goal. Large discrepancy + failure → damaged self-concept.</p><p><strong>Achievement:</strong> Success → favourable self-concept, raises self-esteem. Failure → defeatist attitude, psychosomatic illness. Greatest satisfaction = success earlier than competitors → may lead to <em>delusion of grandeur</em> and <em>superiority complex</em>.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">emotional balance</span><span class="tag">emotional catharsis</span><span class="tag">emotional insecurity</span><span class="tag">Strecker (1956)</span><span class="tag">level of aspiration</span><span class="tag">defeatist attitude</span><span class="tag">delusion of grandeur</span><span class="tag">superiority complex</span></div>`},
{theme:"foundations",marks:"10",tier:"TIER 1",title:"Environmental Determinants of Personality",
front:"What are the environmental determinants? Describe social acceptance, social deprivation, educational factors, family determinants, ordinal position, and family size.",
back:`<p><strong>Social acceptance:</strong> High acceptance → outgoing, flexible. <em>Social isolation</em> → feelings of rejection, resentment, "sour-grapes" attitude → may lead to juvenile delinquency.</p><p><strong>Social deprivation:</strong> Most damaging for very young and elderly. Young deprived of parent contact → socially disapproved behaviour.</p><p><strong>Educational factors:</strong> Emotional climate of institution + student-teacher relationship affect self-concept.</p><p><strong>Family:</strong> Maximal influence at all ages. Direct (child-training) + indirect (identification, imitation). Warm parents → social, gregarious children; anxious parents → nervous children.</p><p><strong>Ordinal position:</strong> Firstborns → conforming, dependent, suffer insecurity when "dethroned." Lastborns → defiance of authority, weak achievement motivation. Middle borns → more peer-oriented, better adjustment.</p><p><strong>Family size:</strong> Larger families → independent/mature earlier but authoritarian control → resentment. Small families → self-confidence but competition → jealousy.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">social acceptance</span><span class="tag">social isolation</span><span class="tag">sour-grapes attitude</span><span class="tag">social deprivation</span><span class="tag">ordinal position</span><span class="tag">identification</span><span class="tag">imitation</span><span class="tag">juvenile delinquency</span></div>`},

// === TYPE THEORIES ===
{theme:"type",marks:"3",tier:"TIER 2",title:"Hippocrates/Galen \u2014 Four-Humour Theory",
front:"Describe the four-humour theory. What four temperaments result from each humour?",
back:`<p><strong>Hippocrates</strong> (~5th century BC, Greek physician) and <strong>Galen</strong> — four internal fluids (humours):</p><ul><li><strong>Blood → Sanguine</strong> (cheerful, active, optimistic, confident)</li><li><strong>Phlegm → Phlegmatic</strong> (apathetic, sluggish, calm, indifferent)</li><li><strong>Black bile → Melancholic</strong> (sad, brooding, depressed)</li><li><strong>Yellow bile → Choleric</strong> (irritable, excitable, aggressive)</li></ul><p>Today regarded as <strong>baseless</strong> — personality/moods not driven by bodily fluids. Departed from the spiritual side of human behaviour.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Hippocrates</span><span class="tag">Galen</span><span class="tag">sanguine/phlegmatic/melancholic/choleric</span><span class="tag">four humours</span><span class="tag">blood/phlegm/black bile/yellow bile</span></div>`},
{theme:"type",marks:"3",tier:"TIER 2",title:"Sheldon's Somatotype Theory",
front:"Describe Sheldon's three somatotypes. What personality characteristics are associated with each?",
back:`<p><strong>William Sheldon</strong> (U.S. physician, 1942):</p><ul><li><strong>Ectomorph</strong> (thin, long, fragile) → artistic, brainy, introverted; cerebrotonic</li><li><strong>Endomorph</strong> (fat, soft, round) → relaxed, fond of eating/sleeping, sociable; viscerotonic</li><li><strong>Mesomorph</strong> (muscular, strong, rectangular) → affective, dominant, energetic, courageous; somatotonic</li></ul><p>Rated on 1–7 scale. Studied juvenile delinquents — generally mesomorphs.</p><p><strong>Criticism:</strong> Weak empirical methodology (Tylor, 1965); poor predictive value; people don't fit into only three types. Not used in mainstream psychology.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Sheldon (1942)</span><span class="tag">ectomorph/cerebrotonic</span><span class="tag">endomorph/viscerotonic</span><span class="tag">mesomorph/somatotonic</span><span class="tag">1–7 scale</span><span class="tag">Tylor (1965) critique</span></div>`},
{theme:"type",marks:"3",tier:"TIER 2",title:"Jungian Types & MBTI",
front:"Describe Jung's personality types and the Myers-Briggs Type Indicator. What four dimensions exist? How many types are possible?",
back:`<p><strong>Carl Jung</strong> (Swiss psychologist, 1922): people prefer certain identifiable behaviours if given free choice.</p><p><strong>Four dimensions (MBTI):</strong></p><ol><li><strong>E or I</strong> — Extraversion-Introversion (source of energy)</li><li><strong>S or N</strong> — Sensing-Intuition (source of perception)</li><li><strong>T or F</strong> — Thinking-Feeling (decision-making)</li><li><strong>J or P</strong> — Judgement-Perception (lifestyle) — added by <em>Isabel Briggs Myers</em></li></ol><p>Combined into 4-letter code → <strong>16 personality types</strong> (e.g., INTJ, ESFP, ISTJ).</p><p>Four cognitive functions: sensory perception, sensory judgment, intuitive feeling, intuitive thinking.</p><p><strong>Keirsey Temperament Sorter:</strong> Guardian, Rational, Idealist, Artisan.</p><p><strong>Jung's ultimate psychological task = Individuation</strong> — based on strengths/limitations of psychological type.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Jung (1922)</span><span class="tag">Myers-Briggs (MBTI)</span><span class="tag">E/I, S/N, T/F, J/P</span><span class="tag">16 personality types</span><span class="tag">individuation</span><span class="tag">Keirsey temperaments</span><span class="tag">Guardian/Rational/Idealist/Artisan</span></div>`},
{theme:"type",marks:"6",tier:"TIER 2",title:"Type A & Type B Personalities",
front:"Describe Type A and Type B personalities. Who developed this classification?",
back:`<p><strong>Meyer Friedman</strong> (cardiologist):</p><ul><li><strong>Type A</strong> — workaholics, always busy, driven, impatient; sit on edge of seats. Higher risk of coronary heart disease.</li><li><strong>Type B</strong> — laid back, easy going, relaxed.</li></ul><p>Origin: Friedman noted tense/impatient patients wore out the front edges of sofas in his waiting room.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Meyer Friedman</span><span class="tag">Type A</span><span class="tag">Type B</span><span class="tag">workaholic</span><span class="tag">coronary heart disease</span></div>`},
{theme:"type",marks:"6",tier:"TIER 2",title:"Limitations of Type Approaches",
front:"What are the general limitations of type approaches compared to trait approaches?",
back:`<p><strong>Limitations:</strong></p><ul><li>Discrete, all-or-nothing categories — many people cannot be fitted.</li><li>Rob the uniqueness of persons.</li><li><em>"Types exist in the eye of the beholder whereas traits exist within the people."</em></li><li>Better to describe actual scores on each dimension rather than force into types.</li></ul><p><strong>Type vs Trait:</strong> Types assume <em>discontinuous</em> categories. Traits assume <em>continuous dimensions</em> varying in quality and degree.</p><p>Modern psychologists prefer trait descriptions over type classification.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">discontinuous vs continuous</span><span class="tag">"eye of the beholder"</span><span class="tag">uniqueness</span><span class="tag">all-or-nothing</span></div>`},

// === TRAIT THEORIES ===
{theme:"trait",marks:"10",tier:"TIER 1",title:"Allport's Trait Theory",
front:"Describe Allport's trait theory. What are cardinal, central, and secondary traits? What is the Proprium?",
back:`<p><strong>Gordon Allport</strong> (1937, 1961): traits are the <em>building blocks of personality</em>. <strong>Idiographic theorist</strong> — each person has unique combination.</p><p><strong>Lexical approach</strong> (Allport & Odbert, 1936): 17,953 trait-descriptive words from English dictionary.</p><p><strong>Three types of individual traits:</strong></p><ul><li><strong>Cardinal</strong> — pervasive, dominant; almost all activity traceable to them. Rare. E.g., Gandhi → non-violence.</li><li><strong>Central</strong> — "building blocks of personality"; ~5–10 per person; readily discernible. E.g., friendliness, dominance.</li><li><strong>Secondary</strong> — less conspicuous, situation-specific. E.g., food preferences.</li></ul><p><strong>Common vs Individual traits:</strong> Common = shared in culture (nomothetic). Individual = unique (idiographic). Allport regarded individual as MORE important.</p><p><strong>Proprium</strong> = Allport's term for the <em>self</em>. personality has unity, consistency, integration — accomplished by the Proprium. Seven propriate functions develop from infancy to adulthood.</p><p><strong>Functional autonomy of motives:</strong> Adult motives are <em>independent of original origins</em>. "What was a means to an end becomes an end in itself."</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Allport (1937, 1961)</span><span class="tag">lexical approach</span><span class="tag">17,953 words</span><span class="tag">cardinal/central/secondary</span><span class="tag">idiographic</span><span class="tag">Proprium</span><span class="tag">functional autonomy</span><span class="tag">common vs individual traits</span></div>`},
{theme:"trait",marks:"10",tier:"TIER 1",title:"Allport's Seven Propriate Functions",
front:"What are Allport's seven propriate functions (developmental stages of the self)?",
back:`<p><strong>Seven Propriate Functions:</strong></p><ol><li><strong>Sense of bodily self</strong> (first year) — awareness of bodily sensations</li><li><strong>Sense of self-identity</strong> (toddler) — continuity of self despite change</li><li><strong>Sense of self-esteem</strong> (third year) — pride in accomplishments</li><li><strong>Sense of self-extension</strong> (4–6 yrs) — self includes "mine"</li><li><strong>Self-image</strong> (~5–6 yrs) — aspirations reflect expectations of significant others; "good me" vs "bad me"</li><li><strong>Sense of self as rational coper</strong> (6–12 yrs) — abstract reasoning applied to problems</li><li><strong>Propriate striving</strong> (adulthood) — unified sense of self; selecting career & long-range life goals</li></ol><p><strong>Two modes of functioning:</strong> Opportunistic (reactive, past-oriented, biological) vs Propriate (proactive, future-oriented, psychological).</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">bodily self</span><span class="tag">self-identity</span><span class="tag">self-esteem</span><span class="tag">self-extension</span><span class="tag">self-image</span><span class="tag">rational coper</span><span class="tag">propriate striving</span><span class="tag">opportunistic vs propriate</span></div>`},
{theme:"trait",marks:"6-10",tier:"TIER 1",title:"Cattell's Trait Theory",
front:"Describe Cattell's trait theory. What are surface vs source traits? What is the 16PF? What are ergs and sentiments?",
back:`<p><strong>Raymond Cattell</strong> (1950): Personality = pattern of traits that predicts behaviour. Used <em>inductive method</em> + factor analysis.</p><p><strong>Surface traits</strong> — observable qualities that "hang together" (kindness, honesty). No unitary basis; little predictive value.</p><p><strong>Source traits</strong> — most basic underlying structures; responsible for intercorrelations among surface traits. Smaller number but <em>better predictors</em>. <strong>16 source traits in normals</strong> → basis of <strong>16 PF Questionnaire</strong>.</p><p><strong>Other categories:</strong> Constitutional (biological) vs Environmental-mold (learned). Ability, Temperament, Dynamic traits.</p><p><strong>Dynamic traits:</strong> <strong>Ergs</strong> — constitutional dynamic source traits (10 ergs: hunger, sex, gregariousness, parental protectiveness, curiosity, escape, pugnacity, acquisitiveness, self-assertion, narcissistic sex). <strong>Sentiments</strong> — environmental-mold dynamic source traits (socially acquired).</p><p><strong>MAVA</strong> (Multiple Abstract Variance Analysis) — estimates genetic vs environmental influence. Finding: ~1/3 heredity, ~2/3 environment.</p><p><strong>Specification Equation:</strong> R = f(S, P) — response is a function of stimulus situation and personality structure.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Cattell (1950)</span><span class="tag">surface vs source traits</span><span class="tag">16 PF</span><span class="tag">ergs (10)</span><span class="tag">sentiments</span><span class="tag">MAVA</span><span class="tag">specification equation R=f(S,P)</span><span class="tag">constitutional vs environmental-mold</span></div>`},
{theme:"trait",marks:"6-10",tier:"TIER 1",title:"Cattell's 16 Source Traits & Global Traits",
front:"What are Cattell's 16 source traits? What are the three global/secondary traits? What are the three sources of data?",
back:`<p><strong>16 Source Traits (16 PF):</strong> Warmth, Reasoning, Emotional Stability, Dominance, Liveliness, Rule-Consciousness, Social Boldness, Sensitivity, Vigilance, Abstractness, Privateness, Apprehension, Openness to Change, Self-Reliance, Perfectionism, Tension.</p><p><strong>Three Global/Secondary Traits:</strong></p><ul><li><strong>Introversion-Extraversion</strong> (Warmth, Liveliness, Social Boldness, Forthrightness, Affiliative)</li><li><strong>Receptivity/Openness vs Tough-Mindedness</strong> (Sensitivity, Abstractedness, Openness-to-Change, Warmth)</li><li><strong>Self-Controlled/Conscientiousness vs Unrestrained</strong> (Rule-Consciousness, Perfectionism, Seriousness, Groundedness)</li></ul><p><strong>Three Sources of Data:</strong></p><ul><li><strong>L-data</strong> (Life Record) — behaviour in everyday situations</li><li><strong>Q-data</strong> (Questionnaire) — self-ratings; prone to faking</li><li><strong>OT-data</strong> (Objective Test) — special situations; resistant to faking</li></ul><p><strong>Syntality</strong> = trait dimensions of social groups (e.g., national syntality: size, morale, affluence, industriousness).</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">16 PF factors</span><span class="tag">global traits</span><span class="tag">L-data/Q-data/OT-data</span><span class="tag">syntality</span></div>`},
{theme:"trait",marks:"6-10",tier:"TIER 1",title:"Eysenck's Trait-Type Theory (PEN Model)",
front:"Describe Eysenck's hierarchical theory. What are the three superfactors? What is the biological basis?",
back:`<p><strong>Hans Eysenck</strong> (1916–1997): Personality is <em>biologically determined</em>, arranged in a <strong>4-level hierarchy</strong>:</p><ol><li><strong>Specific responses</strong> (lowest) — single actions on one occasion</li><li><strong>Habitual responses</strong> — recurring behaviours</li><li><strong>Traits</strong> — intercorrelated habitual responses (e.g., sociability)</li><li><strong>Superfactors/Types</strong> (highest) — intercorrelated traits</li></ol><p><strong>Three superfactors (PEN):</strong></p><ul><li><strong>E</strong> = Extraversion (vs Introversion) — sociable, impulsive vs reserved, introspective</li><li><strong>N</strong> = Neuroticism (vs Stability) — anxious, worried, moody vs calm, even-tempered</li><li><strong>P</strong> = Psychoticism (vs Superego strength) — troublesome, hostile, egocentric vs empathic, conventional</li></ul><p>Superfactors are <strong>orthogonal</strong> (uncorrelated) and <strong>normally distributed dimensions</strong> (NOT discontinuous categories).</p><p><strong>Biological basis — Arousal Theory:</strong></p><ul><li><strong>E:</strong> via ARAS (Ascending Reticular Activating System). Introverts have <em>innately higher cortical arousal</em> → more sensitive to stimulation. Yerkes-Dodson Law (inverted-U: arousal vs performance).</li><li><strong>N:</strong> via visceral brain / limbic system (hippocampus, amygdala, septum, hypothalamus). Neurotics have lower thresholds → easily upset.</li><li><strong>P:</strong> linked to gonadal hormones (testosterone) and MAO (monoamine oxidase).</li></ul><p><strong>Measurement:</strong> EPQ (Eysenck Personality Questionnaire) with Lie Scale. <strong>Lemon Drop Test</strong> (Corcoran, 1964): introverts secrete almost twice the saliva of extraverts.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Eysenck (1916-1997)</span><span class="tag">4-level hierarchy</span><span class="tag">PEN model</span><span class="tag">ARAS</span><span class="tag">Yerkes-Dodson Law</span><span class="tag">limbic system</span><span class="tag">EPQ</span><span class="tag">Lemon Drop Test</span><span class="tag">MAO</span><span class="tag">orthogonal superfactors</span></div>`},
{theme:"trait",marks:"10",tier:"TIER 2",title:"Big Five / Five-Factor Model (FFM)",
front:"What are the Big Five personality factors? What is OCEAN? What measurement tools exist?",
back:`<p><strong>Big Five / Five-Factor Model</strong> — five broad personality dimensions identified by factor analysis.</p><p><strong>OCEAN mnemonic:</strong></p><ol><li><strong>Openness to Experience</strong> — imaginative, insightful, wide interests; vs conventional, down-to-earth</li><li><strong>Conscientiousness</strong> — organised, dependable, thorough, goal-directed; vs undependable, disorganised</li><li><strong>Extraversion</strong> — sociable, active, talkative, optimistic; vs reserved, sober, aloof</li><li><strong>Agreeableness</strong> — trusting, helpful, forgiving, soft-hearted; vs cynical, suspicious, irritable</li><li><strong>Neuroticism</strong> — anxious, moody, insecure, irritable; vs calm, relaxed, emotionally stable</li></ol><p><strong>Key researchers:</strong> Goldberg (1981, 1992); McCrae & Costa (1987, 1990); Fiske (1949).</p><p><strong>Measurement tools:</strong></p><ul><li><strong>NEO-PI-R</strong> (Costa & McCrae, 1992) — 240 items, 6 facets per dimension. Most widely used.</li><li><strong>BFI</strong> (Big Five Inventory) — 44 items, Oliver John</li><li><strong>IPIP</strong> (International Personality Item Pool) — Lew Goldberg, public domain</li><li><strong>Transparent Bipolar Inventory</strong> — Goldberg (1992)</li></ul><p><strong>Mischel (1968)</strong> — severest critic; initiated person-situation debate. Traits are stable over 3–30 years (McCrae & Costa, 1990).</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Big Five</span><span class="tag">OCEAN</span><span class="tag">Goldberg (1981)</span><span class="tag">McCrae & Costa (1987)</span><span class="tag">NEO-PI-R</span><span class="tag">BFI</span><span class="tag">IPIP</span><span class="tag">Mischel (1968)</span><span class="tag">person-situation debate</span></div>`},

// === PSYCHODYNAMIC ===
{theme:"psychodynamic",marks:"10",tier:"TIER 1",title:"Freud's Psychoanalytic Theory \u2014 Structure",
front:"Describe Freud's topographical model and structural model. What are the id, ego, and superego?",
back:`<p><strong>Sigmund Freud</strong> (1890s–1930s):</p><p><strong>Topographical model (states of consciousness):</strong></p><ul><li><strong>Conscious</strong> — immediate experiences (~10%)</li><li><strong>Preconscious</strong> — stored memories, can be brought to consciousness (~10–15%)</li><li><strong>Unconscious</strong> — urges, desires, pain (~75–80%); "dump box"; needs a psychoanalyst</li></ul><p><em>Iceberg metaphor</em>.</p><p><strong>Structural model (three regions of mind):</strong></p><ul><li><strong>Id</strong> — present at birth, totally unconscious; <em>pleasure principle</em>; immediate gratification of primitive needs, sexual desires, aggressive impulses; no regard for reality.</li><li><strong>Ego</strong> — develops from id; <em>reality principle</em>; perception, reasoning, learning; mediates between id and reality; maximises pleasure, minimises pain.</li><li><strong>Superego</strong> — internalisation of parents' moral values; two parts: <strong>ego-ideal</strong> (ideal behaviour) and <strong>conscience</strong> (right/wrong); creates guilt; spans all three levels of consciousness.</li></ul>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Freud</span><span class="tag">conscious/preconscious/unconscious</span><span class="tag">iceberg metaphor</span><span class="tag">id/ego/superego</span><span class="tag">pleasure principle</span><span class="tag">reality principle</span><span class="tag">ego-ideal</span><span class="tag">conscience</span></div>`},
{theme:"psychodynamic",marks:"10",tier:"TIER 1",title:"Freud \u2014 Defense Mechanisms",
front:"What are defense mechanisms? List and describe Freud's major defense mechanisms.",
back:`<p><strong>Defense mechanisms</strong> = ego's function for dealing with anxiety. Unconscious strategies.</p><ul><li><strong>Denial</strong> — denies source of anxiety exists</li><li><strong>Repression</strong> — banishing bad memories/desires from consciousness</li><li><strong>Regression</strong> — moving back to earlier psychosexual stage under stress</li><li><strong>Reaction formation</strong> — doing/thinking the opposite; hallmark = excessive behaviour</li><li><strong>Projection</strong> — ascribing one's own unwanted impulse to someone else</li><li><strong>Rationalisation</strong> — finding rational explanation for wrongdoing</li><li><strong>Intellectualisation</strong> — turning feeling into thought; focusing intellectually to avoid emotion</li><li><strong>Displacement</strong> — moving impulse from one target to another</li><li><strong>Sublimation</strong> — transforming impulses into something constructive; Freud saw this as <em>the most adaptive</em> defense mechanism; greatest civilisational achievements come from effective sublimation</li></ul>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">defense mechanisms</span><span class="tag">sublimation (most adaptive)</span><span class="tag">reaction formation</span><span class="tag">projection</span><span class="tag">rationalisation</span><span class="tag">intellectualisation</span><span class="tag">displacement</span><span class="tag">repression</span><span class="tag">denial</span><span class="tag">regression</span></div>`},
{theme:"psychodynamic",marks:"10",tier:"TIER 1",title:"Freud \u2014 Psychosexual Development",
front:"Describe Freud's five stages of psychosexual development. What is fixation? What are the Oedipus and Electra complexes?",
back:`<p><strong>Five stages</strong> (predetermined sequence; each centres on an erogenous zone):</p><ol><li><strong>Oral</strong> (Birth–18 mo) — mouth. Fixation → smoking, drinking, over-eating, dependent, gullible OR pessimism, aggression.</li><li><strong>Anal</strong> (18 mo–3 yr) — anus; toilet training. Retentive → clean, perfectionist, controlled. Expulsive → messy, disorganised.</li><li><strong>Phallic</strong> (3–6 yr) — genitals. <strong>Oedipus complex</strong> (boy desires mother, father is competitor). <strong>Electra complex</strong> (girl attracted to father — term added by later psychoanalysts). <strong>Castration anxiety</strong>. Identification with same-sex parent forms gender roles. Fixation → sexual deviancy, confused sexual identity.</li><li><strong>Latency</strong> (6 yr–puberty) — dormant libido. Sexual/aggressive drives sublimated. Same-sex peer play.</li><li><strong>Genital</strong> (puberty+) — genitals. Sexual urges reawaken; directed toward opposite-sex peers.</li></ol><p><strong>Fixation</strong> = stuck at a stage. <strong>Regression</strong> = retreat to earlier stage under stress.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">psychosexual development</span><span class="tag">oral/anal/phallic/latency/genital</span><span class="tag">erogenous zone</span><span class="tag">Oedipus complex</span><span class="tag">Electra complex</span><span class="tag">castration anxiety</span><span class="tag">fixation</span><span class="tag">regression</span><span class="tag">identification</span></div>`},
{theme:"psychodynamic",marks:"10",tier:"TIER 1",title:"Freud \u2014 Evaluation (Merits & Demerits)",
front:"What are the merits and demerits of Freud's psychoanalytic theory?",
back:`<p><strong>Merits:</strong></p><ul><li>Complete theory of personality that explains behaviour</li><li>Emphasises role of unconscious and early childhood experiences</li><li>Emphasises dynamic nature of behaviour</li><li>Emphasises defense mechanisms of ego; stimulated further research</li><li>Resulted in serious interest in psychological treatment of mental disorders</li></ul><p><strong>Demerits:</strong></p><ul><li>Lacking empirical evidence; relies on therapeutic achievements</li><li>Clinical data considered flawed, inaccurate, selective</li><li>Methods (dream interpretation, free association) criticised</li><li>Some say psychoanalysis is not a science</li><li>Concepts poorly designed — "psychic energy" has no units of measurement</li><li>Over-emphasis on sexual drive</li><li>Pessimistic <em>psychic determinism</em> (denies free will)</li><li>Role of environment overlooked</li></ul>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">psychic determinism</span><span class="tag">lack of empirical evidence</span><span class="tag">unconscious</span><span class="tag">defense mechanisms</span><span class="tag">over-emphasis on sex</span></div>`},
{theme:"psychodynamic",marks:"10",tier:"TIER 2",title:"Karen Horney \u2014 Social Foundation of Personality",
front:"Describe Horney's theory. What is basic anxiety? What are the 10 neurotic needs? What are the 3 coping strategies?",
back:`<p><strong>Karen Horney</strong> (1885–1952): Opposed <em>penis envy</em> (claimed it was women's justified envy of men's power). Proposed <em>womb envy</em> (men envy women's ability to bear children). Desexualised Oedipus complex. Pioneer of <em>feminine psychiatry</em>.</p><p><strong>Basic anxiety</strong> = "feeling a child has of being isolated and helpless in a potentially hostile world." Caused by <em>basic evil</em> (adverse parental factors). Basic evil provokes resentment → <em>basic hostility</em>. Child faces conflict: expressing hostility risks loss of parental love.</p><p><strong>Ten neurotic needs:</strong> (1) affection/approval, (2) partner, (3) restrict life, (4) power, (5) exploit others, (6) social recognition, (7) personal admiration, (8) personal achievement, (9) self-sufficiency, (10) perfection.</p><p><strong>Three coping strategies:</strong></p><ul><li><strong>Compliance</strong> (Moving-toward / self-effacing) — needs 1–3; response to fear of helplessness</li><li><strong>Aggression</strong> (Moving-against / expansive) — needs 4–8; response to basic hostility</li><li><strong>Withdrawal</strong> (Moving-away-from / resigning) — needs 9–10; becoming self-sufficient</li></ul><p><strong>Theory of the Self:</strong> Real self vs Ideal self. Neurotic's self is split → "tyranny of the should" and "search for glory."</p><p>Horney + Adler = <strong>Neo-Freudians</strong>.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Horney (1885-1952)</span><span class="tag">basic anxiety</span><span class="tag">basic evil</span><span class="tag">basic hostility</span><span class="tag">10 neurotic needs</span><span class="tag">compliance/aggression/withdrawal</span><span class="tag">moving-toward/against/away</span><span class="tag">real self vs ideal self</span><span class="tag">tyranny of the should</span><span class="tag">womb envy</span><span class="tag">neo-Freudians</span></div>`},
{theme:"psychodynamic",marks:"10",tier:"TIER 3",title:"Sullivan \u2014 Interpersonal Theory of Psychiatry",
front:"Describe Sullivan's interpersonal theory. What are the three levels of cognition? What is the self-system? What are the seven developmental epochs?",
back:`<p><strong>Harry Stack Sullivan</strong> (died 1949): "Interpersonal theory of psychiatry" — study of what goes on <em>between</em> people (vs Freud's focus on what goes on inside). <strong>Father = drive model; Sullivan = interpersonal model.</strong></p><p><strong>Three levels of cognition:</strong></p><ol><li><strong>Prototaxic</strong> — primitive infant experience; impossible to verbalise</li><li><strong>Parataxic</strong> — prelogical; erroneous cause-effect assumptions (<em>parataxic distortions</em>)</li><li><strong>Syntaxic</strong> — can be accurately communicated; shared meaning with words</li></ol><p><strong>Self-system</strong> = most inclusive dynamism; protects against anxiety; maintains interpersonal security. <strong>Security operations</strong>: dissociation (blocking experiences from awareness) and selective inattention.</p><p><strong>Three personifications:</strong> Good-me (liked aspects), Bad-me (negative aspects; hidden), Not-me (so anxiety-provoking cannot be faced; unconscious).</p><p><strong>Seven developmental epochs:</strong> Infancy (0–1) → Childhood (1–5) → Juvenile (6–8) → Pre-adolescence (9–12) → Early adolescence (13–17) → Late adolescence (18–22) → Adulthood (23+). <em>Timing dictated by social environment</em> (unlike Freud).</p><p><strong>Euphoria</strong> = complete absence of anxiety. <strong>Anxiety</strong> = chief disruptive force in interpersonal relations. Learned via <em>empathic relationship with the "mothering one"</em>.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Sullivan</span><span class="tag">interpersonal theory</span><span class="tag">prototaxic/parataxic/syntaxic</span><span class="tag">parataxic distortions</span><span class="tag">self-system</span><span class="tag">security operations</span><span class="tag">good-me/bad-me/not-me</span><span class="tag">seven epochs</span><span class="tag">mothering one</span><span class="tag">euphoria</span></div>`},

// === LEARNING & COGNITIVE ===
{theme:"learning",marks:"6-10",tier:"TIER 2",title:"Pavlov \u2014 Classical Conditioning",
front:"Describe Pavlov's classical conditioning. What are UCS, UCR, CS, CR? What is experimental neurosis?",
back:`<p><strong>Ivan Petrovich Pavlov</strong> (1849–1936): Russian physiologist; Nobel Prize 1904 (digestion). Behaviourist.</p><p><strong>Classical conditioning</strong> = form of learning in which capacity of eliciting a response is transferred from one stimulus to another.</p><ul><li><strong>UCS</strong> (Unconditioned Stimulus) = meat powder → elicits <strong>UCR</strong> (salivation)</li><li><strong>CS</strong> (Conditioned Stimulus) = bell → after repeated pairing with UCS → elicits <strong>CR</strong> (conditioned salivation)</li></ul><p><strong>Principles:</strong></p><ul><li><strong>Acquisition</strong> — number of pairings + interval (max ~0.5 s)</li><li><strong>Generalisation</strong> — respond to similar stimuli</li><li><strong>Discrimination</strong> — distinguish between similar stimuli</li><li><strong>Extinction</strong> — CS without UCS → CR fades</li><li><strong>Spontaneous recovery</strong> — re-presenting extinguished stimulus → CR reappears</li><li><strong>Higher-order conditioning</strong></li></ul><p><strong>Experimental neurosis</strong> (Shenger-Krestovnika, 1921): Dog trained to discriminate circle (fed) vs ellipse (not fed). Ellipse gradually made almost circular → dog became neurotic, ceased discriminating. <em>Pavlov attributed to disturbance of balance between excitatory and inhibitory processes</em>.</p><p><strong>Applications:</strong> Systematic desensitisation, flooding, aversion therapy, counter-conditioning.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Pavlov (1849-1936)</span><span class="tag">UCS/UCR/CS/CR</span><span class="tag">acquisition</span><span class="tag">generalisation/discrimination</span><span class="tag">extinction</span><span class="tag">spontaneous recovery</span><span class="tag">experimental neurosis</span><span class="tag">systematic desensitisation</span><span class="tag">aversion therapy</span></div>`},
{theme:"learning",marks:"6-10",tier:"TIER 2",title:"Skinner \u2014 Operant Conditioning",
front:"Describe Skinner's operant conditioning. What are reinforcers, schedules of reinforcement, shaping, and token economy?",
back:`<p><strong>B.F. Skinner</strong> (1904–1990): "Most celebrated psychologist since Freud." Personality = collection of learned behaviour patterns.</p><p><strong>Operant behaviour</strong> — not caused by specific stimulus; voluntary; frequency changes based on <em>following</em> event. <strong>Respondent behaviour</strong> = elicited by stimuli (involuntary).</p><p><strong>Reinforcer</strong> = anything that strengthens tendency to behave. <strong>Positive</strong> (adding pleasant) vs <strong>Negative</strong> (removing unpleasant). <strong>Aversive stimulus</strong> = unpleasant; decreases behaviour = <strong>punishment</strong>.</p><p><strong>Schedules of reinforcement:</strong> Continuous, Intermittent (Fixed ratio, Fixed interval, Variable ratio, Variable interval). <em>Variable interval = most resistant to extinction</em>.</p><p><strong>Shaping</strong> = reinforcing closer approximations progressively. <strong>Successive approximation</strong>.</p><p><strong>Superstitious behaviour</strong> = conditioning with no causal relationship (rain dance).</p><p><strong>Token economy</strong> — used in psychiatric hospitals, prisons; tokens for appropriate behaviour; traded for privileges.</p><p><strong>Criticisms:</strong> Chomsky (1959) — language cannot be explained by operant conditioning. Boulding (1984) — animal principles may not apply to complex human behaviour. Not a comprehensive theory of personality. Biological factors ignored.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Skinner (1904-1990)</span><span class="tag">operant/respondent behaviour</span><span class="tag">reinforcer (positive/negative)</span><span class="tag">schedules</span><span class="tag">variable interval (most resistant)</span><span class="tag">shaping</span><span class="tag">superstitious behaviour</span><span class="tag">token economy</span><span class="tag">Chomsky critique</span></div>`},
{theme:"learning",marks:"10",tier:"TIER 3",title:"Bandura \u2014 Social Cognitive Theory",
front:"Describe Bandura's social cognitive theory. What is reciprocal determinism? What is self-efficacy? Describe the Bobo doll experiment.",
back:`<p><strong>Albert Bandura</strong> (b. 1925): Renamed "Social Learning Theory" as <em>Social Cognitive Theory</em>.</p><p><strong>Triadic reciprocal determinism</strong> — three interacting determinants influence each other bidirectionally: <strong>P</strong> (Personal/cognitive) ↔ <strong>B</strong> (Behaviour) ↔ <strong>E</strong> (Environment). "People are both products and producers of their environment."</p><p><strong>Self-efficacy</strong> = "belief in one's capabilities to organise and execute courses of action required to manage prospective situations" (Bandura, 1995).</p><p><strong>Four sources of self-efficacy:</strong> (1) Mastery experiences (most effective), (2) Social modeling, (3) Social persuasion, (4) Psychological responses (mood, stress).</p><p><strong>Bobo Doll Experiment:</strong> Kindergartners watched film of woman punching, kicking inflatable Bobo doll. Children then imitated precisely — punched, kicked, said "sockeroo!" <em>Children changed behaviour without being rewarded</em> — contradicted behaviouristic learning theory.</p><p><strong>Four steps of modeling:</strong> (1) Attentional, (2) Retentional, (3) Reproduction, (4) Motivational processes.</p><p><strong>Vicarious learning</strong> = learning from other people's behaviour. <strong>Symbolic modeling</strong> = verbal/pictorial portrayals.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Bandura</span><span class="tag">triadic reciprocal determinism (P-B-E)</span><span class="tag">self-efficacy</span><span class="tag">Bobo doll</span><span class="tag">observational learning</span><span class="tag">modeling (4 steps)</span><span class="tag">vicarious learning</span><span class="tag">mastery experiences</span></div>`},

// === HUMANISTIC ===
{theme:"humanistic",marks:"6",tier:"TIER 1",title:"Maslow \u2014 Hierarchy of Needs",
front:"Describe Maslow's hierarchy of needs. What are D-needs and B-needs? What are the characteristics of self-actualisers?",
back:`<p><strong>Abraham Maslow</strong> (1908–1970): Humanistic psychology = <em>"The Third Force"</em> (vs psychodynamic + behaviourist). Holistic approach. Focus on <em>potentials</em>.</p><p><strong>Five levels (hierarchy):</strong></p><ol><li><strong>Physiological</strong> — air, food, water, sleep. Most basic.</li><li><strong>Safety</strong> — security, shelter, steady employment</li><li><strong>Belongingness</strong> — love, affection, friendships, family</li><li><strong>Esteem</strong> — lower (respect of others, status, fame) + higher (self-respect, competence, mastery, self-confidence). Deprivation → inferiority complex.</li><li><strong>Self-actualisation</strong> — "What a man can be, he must be." To reach it, must satisfy AND master lower needs.</li></ol><p><strong>D-needs</strong> (deficiency/deprivation needs) = first 4 levels; operate on homeostasis principle. <strong>B-needs</strong> (being/growth needs) = self-actualisation; continuous desire to fulfill potentials. Under stress → can <em>regress</em> to lower level.</p><p><strong>Self-actualisers</strong> (Maslow studied Lincoln, Einstein, Eleanor Roosevelt, Jefferson): reality-centered, problem-centered, autonomous, resist enculturation, unhostile humour, acceptance of self/others, spontaneity, creativity, peak (mystical) experiences, democratic value, human kinship. Imperfections: realistic anxiety, ruthlessness, metapathologies.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Maslow (1908-1970)</span><span class="tag">hierarchy of needs</span><span class="tag">D-needs vs B-needs</span><span class="tag">self-actualisation</span><span class="tag">Third Force</span><span class="tag">peak experiences</span><span class="tag">homeostasis</span><span class="tag">regression</span><span class="tag">metapathologies</span></div>`},
{theme:"humanistic",marks:"10",tier:"TIER 2",title:"Rogers \u2014 Person-Centered / Self Theory",
front:"Describe Rogers's person-centered theory. What is the self? What are the real self and ideal self? What is unconditional positive regard?",
back:`<p><strong>Carl Rogers</strong> (1902–): Person-centered / self theory. Key books: <em>Client-Centered Therapy</em> (1951), <em>On Becoming a Person</em> (1961).</p><p><strong>Self</strong> = organised, consistent set of perceptions of who I am. Develops through interactions with environment, especially with others.</p><p><strong>Real self</strong> = who/what we actually are. <strong>Ideal self</strong> = who we would like to be. <em>Congruence</em> between real and ideal self = healthy personality. Incongruence = anxiety, defensiveness.</p><p><strong>Need for positive regard</strong> — innate, universal. <strong>Unconditional positive regard</strong> = acceptance and love without conditions. <strong>Conditional positive regard</strong> = acceptance only when conditions met → leads to incongruence.</p><p><strong>Fully functioning person</strong> = open to experience, lives existentially, trusts own organism, makes choices, is creative, lives harmoniously with others. Continues to grow.</p><p><strong>Three therapeutic conditions:</strong> (1) Genuineness/congruence, (2) Unconditional positive regard, (3) Empathic understanding.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Rogers</span><span class="tag">person-centered</span><span class="tag">self</span><span class="tag">real self vs ideal self</span><span class="tag">congruence</span><span class="tag">unconditional positive regard</span><span class="tag">fully functioning person</span><span class="tag">client-centered therapy</span><span class="tag">empathic understanding</span></div>`},

// === ASSESSMENT ===
{theme:"assessment",marks:"6",tier:"TIER 2",title:"Personality Assessment \u2014 Overview & Approaches",
front:"What is personality assessment? What are the three broad categories of methods? What are the four technical criteria?",
back:`<p><strong>Personality assessment</strong> = estimation of one's personality make-up (characteristic behaviour patterns + salient stable characteristics). Many prefer an <em>eclectic view</em>.</p><p><strong>Three categories of methods:</strong></p><ul><li><strong>Subjective</strong> — person's work, autobiographical accounts, biographies. Limitation: may exaggerate strengths.</li><li><strong>Objective</strong> — inventories; standardised; relatively free from bias.</li><li><strong>Projective</strong> — ambiguous stimuli; reveal unconscious aspects.</li></ul><p><strong>Four technical criteria</strong> (must be met before scientifically acceptable):</p><ol><li><strong>Standardisation</strong> — uniform procedures in administration and scoring</li><li><strong>Norms</strong> — raw scores converted to percentile scores; comparison to representative group</li><li><strong>Reliability</strong> — consistency/stability (test-retest, split-half, parallel forms, inter-scorer); coefficients above +.70</li><li><strong>Validity</strong> — measures what it intends to (content, criterion-related [predictive, concurrent], construct [convergent, divergent])</li></ol>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">assessment</span><span class="tag">subjective/objective/projective</span><span class="tag">standardisation</span><span class="tag">norms</span><span class="tag">reliability</span><span class="tag">validity</span><span class="tag">content/criterion/construct validity</span><span class="tag">test-retest/split-half</span></div>`},
{theme:"assessment",marks:"6-10",tier:"TIER 1",title:"Self-Report Personality Inventories",
front:"What are self-report inventories? What are their strengths and weaknesses? How can faking be detected?",
back:`<p><strong>Self-report inventories</strong> = self-rating questionnaires where individual describes own feelings, reactions. Standardised response alternatives (True/False, Agree/Disagree).</p><p><strong>Five types:</strong> (1) Social/specific traits (Bernreuter, EPQ), (2) Adjustment (Bell's), (3) Pathological traits (MMPI, 16 PF), (4) Screening (Cornell Index), (5) Attitudes/interests/values (Strong Vocational, Allport-Vernon).</p><p><strong>Strengths:</strong> Objectivity of scoring; easy administration; greater reliability; multi-dimensional.</p><p><strong>Weaknesses:</strong> Susceptible to <em>deliberate deception</em>; influence of <em>social desirability</em>; <em>response set</em> (Kleinmuntz, 1982).</p><p><strong>Faking:</strong> "Fake good" (employment) vs "Fake bad" (criminal competency). Social desirability = unintentionally presenting self favourably. <strong>Marlowe-Crowne Social Desirability Scale</strong> (Crowne & Marlowe, 1964).</p><p><strong>Methods to overcome:</strong> (1) Rapport, (2) Forced-choice technique, (3) Concealing main purpose, (4) Verification/correction keys. MMPI has <em>validity scales</em> + <em>filler items</em> + <em>acquiescence response set</em> countermeasures.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">self-report inventory</span><span class="tag">fake good/fake bad</span><span class="tag">social desirability</span><span class="tag">response set</span><span class="tag">Marlowe-Crowne Scale</span><span class="tag">forced-choice</span><span class="tag">validity scales</span><span class="tag">acquiescence response set</span></div>`},
{theme:"assessment",marks:"3-6",tier:"TIER 1",title:"Rorschach Inkblot Test",
front:"Describe the Rorschach Inkblot Test. How is it administered? What are the scoring categories?",
back:`<p><strong>Hermann Rorschach</strong> (1921, Swiss psychiatrist): 10 inkblots — 5 black ink, 5 coloured. Measures both intellectual and non-intellectual personality traits.</p><p><strong>Three stages of administration:</strong></p><ol><li><strong>Performance Proper</strong> — "What do you think this could be?" Records reaction time, position of card, verbatim responses, total time. All 10 plates presented. Total responses = <em>response productivity ratio (R)</em> — most adults: 15–30 responses.</li><li><strong>Inquiry</strong> — location sheet presented; examinee locates part of blot used.</li><li><strong>Scoring</strong> — several systems; Exner (1969) developed single <em>Comprehensive System</em>.</li></ol><p><strong>Scoring categories:</strong></p><ul><li><strong>Location</strong> — W (whole), D (common detail), d, Dd (unusual detail)</li><li><strong>Determinants</strong> — F (form), C (colour), S (shading), M (movement)</li><li><strong>Content</strong> — H (human), Hd (human detail), A (animal), Ad (animal detail), art, plants, maps</li><li><strong>Popular responses</strong> — common for specific cards</li></ul><p>"Whole" responses → conceptual thinking; colour responses → emotionality and fantasy life.</p><p><strong>Holtzman Inkblot Test (HIT)</strong> — Holtzman et al. (1961): Two parallel forms (A and B), 45 cards each, one response per card, 22 response variables. Better standardised. HIT 25 (1988) — diagnoses schizophrenia.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Rorschach (1921)</span><span class="tag">10 inkblots</span><span class="tag">performance proper/inquiry/scoring</span><span class="tag">W/D/Dd</span><span class="tag">F/C/S/M</span><span class="tag">Exner Comprehensive System (1969)</span><span class="tag">Holtzman HIT</span><span class="tag">22 response variables</span></div>`},
{theme:"assessment",marks:"3-6",tier:"TIER 1",title:"Thematic Apperception Test (TAT)",
front:"Describe the TAT. Who developed it? How is it administered and interpreted?",
back:`<p><strong>Morgan and Murray (1935)</strong>: 20 pictures, all black and white, deliberately drawn in ambiguous situations.</p><p><strong>Administration:</strong> Client told a story about person/people in picture: what is happening, what caused the event, what happened in the past, what will happen in the future.</p><p><strong>Interpretation:</strong> Examiner first determines the <em>"hero"</em> — character of either sex with whom respondent identifies. Content analysed in reference to <strong>Murray's list of "needs" and "press":</strong></p><ul><li><strong>Needs</strong> — e.g., achievement, affiliation, aggression</li><li><strong>Press</strong> — environmental forces that facilitate or interfere with need satisfaction</li></ul><p>Used extensively in personality research.</p><p><strong>Limitations:</strong> High variations in administration and scoring procedures → difficult to investigate psychometric properties. Still, clinical utility confirmed.</p><p><strong>Classification (Lindzay, 1959):</strong> TAT = <em>Construction technique</em>. Other categories: Association, Completion, Expressive, Choice/Ordering.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Morgan & Murray (1935)</span><span class="tag">TAT</span><span class="tag">20 pictures</span><span class="tag">hero</span><span class="tag">needs</span><span class="tag">press</span><span class="tag">construction technique</span><span class="tag">Lindzay (1959)</span></div>`},
{theme:"assessment",marks:"6-10",tier:"TIER 1",title:"Behavioural & Situational Assessment",
front:"What is behavioural assessment? Describe observation, naturalistic observation, and situational tests.",
back:`<p><strong>Behavioural assessment:</strong> Behaviourists assume personality = learned responses to stimuli. Preferred method = observe behaviour in real world.</p><p><strong>Direct observation:</strong> Psychologist observes client in ordinary, everyday behaviour, preferably in natural setting. "Observation is the sine qua non of any approach to personality study."</p><p><strong>Naturalistic observation:</strong> Observe and record behaviour as it naturally occurs (real-life settings). Topics: play patterns, antisocial behaviour, eating behaviours, leadership. Limitations: unpredictable events, observer bias, generalisation questionable, observer may interfere (Kazdin, 1982).</p><p><strong>Situational tests:</strong> Compromise between standardised test and observation. Personality traits measured based on observations in situations resembling real life. Subject usually unaware of being studied. <strong>First situational test: OSS (WWII)</strong> to screen men for military reassignments. Suited to measuring leadership, dominance, responsibility.</p><p><strong>Hartshorne, May & Shuttleworth (1930) — CEI:</strong> Character Educational Inquiry. Used natural school situations. Measured altruism, honesty, self-control. <em>Duplicating technique</em> — detected cheating by comparing duplicated test responses with self-scored responses.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">behavioural assessment</span><span class="tag">direct observation</span><span class="tag">naturalistic observation</span><span class="tag">situational tests</span><span class="tag">OSS</span><span class="tag">Hartshorne, May & Shuttleworth (1930)</span><span class="tag">CEI</span><span class="tag">duplicating technique</span><span class="tag">observer bias</span></div>`},
{theme:"assessment",marks:"3",tier:"TIER 2",title:"MMPI-2 \u2014 Minnesota Multiphasic Personality Inventory",
front:"Describe the MMPI-2. How many items? What scales does it have? What is its purpose?",
back:`<p><strong>MMPI-2</strong> — Hathaway and McKinley (1943, original); MMPI-2 = Butcher et al. (2000, 2001). <em>Most common personality inventory.</em></p><p><strong>567 statements</strong> (e.g., "I am very often tense"). Person answers True, False, or Cannot Say.</p><p><strong>10 clinical scales</strong> + <strong>8 validity scales</strong> in addition to numerous subscales. Each scale tests for a particular kind of behaviour.</p><p>Behaviour patterns range from mild (excessive worrying, shyness) to serious disorders (schizophrenia, depression).</p><p><strong>Validity scales</strong> indicate whether person is responding honestly. Certain items repeated throughout test in slightly different form — anyone trying to "fake" will have difficulty responding consistently. E.g., "I am always very happy" — responding "true" suggests trying to look better.</p><p><strong>Eysenck (1953)</strong> demonstrated that one hour of paper-and-pencil testing yielded results fully comparable to 2.5-day assessment center.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">MMPI-2</span><span class="tag">Hathaway & McKinley (1943)</span><span class="tag">567 statements</span><span class="tag">10 clinical scales</span><span class="tag">8 validity scales</span><span class="tag">faking detection</span></div>`},
{theme:"assessment",marks:"3-6",tier:"TIER 1",title:"Projective Techniques \u2014 Frank\u2019s Classification",
front:"What are projective techniques? How did Frank classify them? What are the strengths and weaknesses?",
back:`<p><strong>Projective tests</strong> = ambiguous stimuli; reveal <em>unconscious</em> conflicts, fears, concerns. <strong>Frank (1939)</strong> coined "projective technique." Based on Freud's theory.</p><p><strong>Common features:</strong> Ambiguous/unstructured stimuli; test taker never told purpose; no correct/incorrect answer; scoring relies on <em>subjective clinical judgements</em>.</p><p><strong>Frank's 5 categories:</strong></p><ol><li><strong>Constructive</strong> — examinee constructs (e.g., draw human figure)</li><li><strong>Constitutive</strong> — imposes structure on unstructured material (e.g., Rorschach)</li><li><strong>Cathartic</strong> — releases wishes/conflicts through manipulative tasks</li><li><strong>Interpretative</strong> — adds meaning to a situation (e.g., TAT, Word Association)</li><li><strong>Refractive</strong> — depicts personality through drawing/painting (e.g., graphology)</li></ol><p><strong>Lindzay (1959)</strong> categories: Association, Construction, Completion, Expressive, Choice/Ordering.</p><p><strong>Strengths:</strong> Indirect method disguises real purpose; circumvents conscious defenses.</p><p><strong>Weaknesses:</strong> Poorly standardised; low reliability; interpretation depends on clinician's intuition; little evidence for validity (Aiken, 1984; Peterson, 1978). Despite problems, Rorschach and TAT ranked 2nd and 4th in usage among psychometric instruments.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Frank (1939)</span><span class="tag">projective technique</span><span class="tag">ambiguous stimuli</span><span class="tag">unconscious</span><span class="tag">5 categories (constructive/constitutive/cathartic/interpretative/refractive)</span><span class="tag">Lindzay (1959)</span><span class="tag">circumvent conscious defenses</span></div>`},
{theme:"assessment",marks:"6",tier:"TIER 2",title:"Reliability & Validity in Detail",
front:"Describe the types of reliability and validity. What is the difference between convergent and divergent validity?",
back:`<p><strong>Reliability</strong> = consistency/stability of an assessment technique.</p><p><strong>Types of reliability:</strong></p><ul><li><strong>Test-retest</strong> (Anastasi, 1968) — same test, two occasions; correlations above +.70</li><li><strong>Split-half</strong> — odd vs even items; internal consistency</li><li><strong>Parallel forms</strong> — two versions of same test</li><li><strong>Inter-scorer</strong> — agreement between judges; especially low with qualitative data; increased by manuals with explicit scoring rules (Yin, 1984)</li></ul><p><strong>Validity</strong> = whether a test measures what it is intended to measure.</p><p><strong>Types of validity:</strong></p><ul><li><strong>Content validity</strong> — items representative of entire domain; determined by expert agreement</li><li><strong>Predictive validity</strong> — predicts future criterion behaviour</li><li><strong>Concurrent validity</strong> — correlates with another currently derived measure; <em>criterion contamination</em> = clinicians must not know test scores</li><li><strong>Construct validity</strong> (Cronbach & Meehl, 1955) — most crucial for personality assessment; measures hypothetical constructs (self-actualisation, ego-identity)</li><li><strong>Convergent validity</strong> (Campbell & Fiske, 1959) — correlates with another test of same construct</li><li><strong>Divergent/Discriminant validity</strong> (Campbell & Fiske, 1959) — does NOT correlate with measures of conceptually distinct qualities</li></ul>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">reliability</span><span class="tag">test-retest/split-half/parallel forms/inter-scorer</span><span class="tag">validity</span><span class="tag">content/predictive/concurrent/construct</span><span class="tag">convergent vs divergent validity</span><span class="tag">Campbell & Fiske (1959)</span><span class="tag">Cronbach & Meehl (1955)</span><span class="tag">criterion contamination</span></div>`},
{theme:"assessment",marks:"10",tier:"TIER 1",title:"Allport\u2019s Study of Values",
front:"What is the Study of Values? Who developed it and on what basis? What are the six value types?",
back:`<p><strong>Allport & colleagues</strong> — based on <strong>Eduard Spranger's "Types of Men"</strong> (European psychologist). Test: <strong>Study of Values</strong> (Allport et al., 1960).</p><p>A mature person's unifying philosophy is founded upon <em>values</em> — basic convictions about what is/isn't important. Spranger outlined <strong>six major value types</strong> found in varying degrees in all people:</p><ol><li><strong>Theoretical</strong> — discovery of truth; rational, critical, empirical; science/philosophy</li><li><strong>Economic</strong> — useful/pragmatic; practical; making money</li><li><strong>Aesthetic</strong> — form and harmony; grace, symmetry, fitness</li><li><strong>Social</strong> — love of people; regards theoretical/economic/aesthetic as cold/inhuman</li><li><strong>Political</strong> — power, influence, renown</li><li><strong>Religious</strong> — understanding world as unified whole; seeks unity and higher meaning</li></ol><p>Allport called these <em>"deep level traits."</em> Test: 45 questions, 20 minutes. No one falls exclusively under one value type.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Allport</span><span class="tag">Spranger's Types of Men</span><span class="tag">six values (theoretical/economic/aesthetic/social/political/religious)</span><span class="tag">Study of Values scale</span><span class="tag">deep level traits</span></div>`},
{theme:"foundations",marks:"3",tier:"TIER 3",title:"History of Personality Assessment",
front:"Trace the history of personality assessment from ancient times to the present. Include key dates and figures.",
back:`<p><strong>Timeline:</strong></p><ul><li><strong>~1000 BC</strong> — Chinese written tests for civil service</li><li><strong>~190 AD</strong> — <strong>Galen</strong>: four temperaments (sanguine, phlegmatic, choleric, melancholic)</li><li><strong>1879</strong> — <strong>Wundt</strong>: first psychology lab (Leipzig); four temperaments as personality dimensions</li><li><strong>1890</strong> — <strong>James Cattell</strong>: mental test for college students</li><li><strong>1905</strong> — <strong>Binet & Simon</strong>: first scale of mental development (Binet-Simon scale)</li><li><strong>1914 (WWI)</strong> — <strong>Army Alpha and Beta tests</strong></li><li><strong>1916</strong> — <strong>Terman</strong>: IQ; Stanford-Binet Test</li><li><strong>1918</strong> — <strong>Woodworth</strong>: first personality inventory (Personal Data Sheet, 116 questions, WWI screening)</li><li><strong>1920s</strong> — <strong>German Assessment Center</strong> (military officer selection); modern assessment center invented</li><li><strong>1942</strong> — <strong>OSS</strong> (Office of Strategic Services) — assessment center for WWII</li><li><strong>1943</strong> — <strong>Hathaway & McKinley</strong>: MMPI</li><li><strong>1980–present</strong> — Computer-administered, scored, interpreted tests</li></ul>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Galen (190 AD)</span><span class="tag">Wundt (1879)</span><span class="tag">Binet-Simon (1905)</span><span class="tag">Army Alpha/Beta</span><span class="tag">Terman (1916)</span><span class="tag">Woodworth (1918)</span><span class="tag">German Assessment Center</span><span class="tag">OSS (1942)</span><span class="tag">MMPI (1943)</span></div>`},
{theme:"foundations",marks:"10",tier:"TIER 1",title:"Allport\u2019s Mature Personality",
front:"What are the six attributes of the psychologically mature adult according to Allport?",
back:`<p><strong>Allport (1961):</strong> Mature personality = continuous, lifelong process of becoming. Mature behaviour is <em>functionally autonomous and motivated by conscious processes</em>.</p><p><strong>Six attributes:</strong></p><ol><li><strong>Widely extended sense of self</strong> — participates in work, family, social relationships, hobbies, politics, religion</li><li><strong>Capacity for warm social interactions</strong> — two kinds: <em>intimacy</em> (deep love for family/close friends) + <em>compassion</em> (tolerance of differences; respect for all people)</li><li><strong>Emotional security and self-acceptance</strong> — positive self-image; tolerates frustration, anger, guilt, depression without harming others</li><li><strong>Realistic perception, skills, and assignments</strong> — sees things as they are; appropriate skills; sets aside personal desires for the task</li><li><strong>Self-insight and humour</strong> — accurate picture of strengths/weaknesses; humour prevents self-glorification and "phoniness"; ability to laugh at what one cherishes while still cherishing it</li><li><strong>Unifying philosophy of life</strong> — "puts it all together"; deeply held value system gives dominant goal/theme</li></ol>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Allport (1961)</span><span class="tag">extended self</span><span class="tag">intimacy vs compassion</span><span class="tag">emotional security</span><span class="tag">self-insight</span><span class="tag">unifying philosophy</span><span class="tag">functional autonomy</span></div>`},
{theme:"foundations",marks:"6-10",tier:"TIER 1",title:"Guilford\u2019s Trait Theory",
front:"Describe Guilford's trait theory. What are the seven modalities? What is the GZTS?",
back:`<p><strong>J.P. Guilford</strong> (1959, 1988): "Personality is the individual's unique pattern of traits." Used factor analysis.</p><p><strong>Seven modalities of traits:</strong></p><ol><li><strong>Morphological</strong> (somatic) — physical attributes</li><li><strong>Physiological</strong> (somatic) — physical functions (heart rate, hormone level)</li><li><strong>Needs</strong> (behavioural/motivation)</li><li><strong>Interests</strong> (behavioural)</li><li><strong>Attitudes</strong> (behavioural) — cognitive + affective + conative</li><li><strong>Aptitudes</strong> (behavioural) — how well one can perform</li><li><strong>Temperament</strong> (behavioural) — manner of performing behaviour</li></ol><p>First two = somatic; last five = behavioural. Personality is an <em>integrated whole</em>, viewable from seven angles.</p><p><strong>Guilford-Zimmerman Temperament Survey (GZTS)</strong> — 10 bipolar traits: General activity, Restraint, Ascendance, Sociability, Emotional stability, Objectivity, Friendliness, Thoughtfulness, Personal relations, Masculinity.</p><p><strong>Structure-of-Intellect Model:</strong> 5 operations × 6 products × 4 contents = 120 factors (later expanded to 180).</p><p><strong>Three levels of trait generality:</strong> Hexic (situation-specific), Primary trait (broader range), Type level (single dominant disposition).</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Guilford (1959, 1988)</span><span class="tag">seven modalities</span><span class="tag">GZTS (10 bipolar traits)</span><span class="tag">Structure-of-Intellect</span><span class="tag">120/180 factors</span><span class="tag">hexic/primary/type levels</span></div>`},

// === PSYCHODYNAMIC ===
{theme:"psychodynamic",marks:"10",tier:"TIER 1",title:"Freud \u2014 Dynamics of Personality (Instincts)",
front:"What are Eros and Thanatos? What is libido? How do instincts work in Freud's theory?",
back:`<p><strong>Freud:</strong> Human organism uses <em>physiological energy</em> (physical activity) and <em>psychic energy</em> (psychological work: thinking, feeling, remembering). Id is the contact point between the two.</p><p><strong>Two instinctual drives:</strong></p><ul><li><strong>Eros</strong> (life/love) — establishes/preserves unity through relationships</li><li><strong>Thanatos</strong> (death) — undoes connections and unity; destructive/cruel forces</li></ul><p><strong>Libido</strong> — main source of psychic energy; comes from Eros and Thanatos. Instincts can combine (attraction) or oppose (repulsion) each other.</p><p><strong>Instincts = ultimate cause of all behaviour.</strong> Personality is shaped as drives are modified by conflicts at different times in childhood (psychosexual development).</p><p><strong>Key assumptions of psychodynamic perspective:</strong></p><ul><li>Behaviour powerfully affected by <em>unconscious motives</em></li><li>Adult behaviour rooted in <em>childhood experiences</em></li><li>All behaviour has a cause (usually unconscious) — <em>psychic determinism</em></li><li>Personality is <em>tripartite</em> (id, ego, superego)</li><li>Unconscious mind in constant conflict with conscious mind</li></ul>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Eros (life)</span><span class="tag">Thanatos (death)</span><span class="tag">libido</span><span class="tag">psychic energy</span><span class="tag">psychic determinism</span><span class="tag">tripartite personality</span></div>`},

// === ASSESSMENT ===
{theme:"assessment",marks:"6-10",tier:"TIER 1",title:"Eysenck Personality Questionnaire (EPQ)",
front:"Describe the EPQ. What scales does it contain? What are key differences between introverts and extraverts?",
back:`<p><strong>Eysenck & Eysenck (1975):</strong> EPQ assesses individual differences on three supertrait dimensions (E, N, P). Includes a <em>Lie Scale</em> to detect faking. <strong>Junior EPQ (JEPQ)</strong> for children ages 7–15 (Eysenck & Eysenck, 1973).</p><p><strong>Differences between introverts and extraverts (Wilson, 1978 review):</strong></p><ul><li>Extraverts have greater <em>pain tolerance</em></li><li><em>Excitement enhances extraverts' performance</em> but interferes with introverts'</li><li>Introverts prefer theoretical/scientific vocations; extraverts prefer people-oriented jobs</li><li>Introverts attain <em>higher college grades</em></li><li>Students withdrawing for <em>psychiatric reasons</em> tend to be introverts; <em>academic reasons</em> tend to be extraverts</li><li>Introverts show higher arousal in mornings; extraverts in evenings</li><li>Introverts work better in morning; extraverts in afternoon</li></ul><p><strong>Lemon Drop Test</strong> (Corcoran, 1964): 4 drops of lemon juice on tongue → introverts secrete almost twice the saliva as extraverts. Basis: different patterns of physiological functioning; ARAS controls differences.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">EPQ (1975)</span><span class="tag">Lie Scale</span><span class="tag">JEPQ</span><span class="tag">Wilson (1978)</span><span class="tag">Lemon Drop Test</span><span class="tag">Corcoran (1964)</span></div>`},
{theme:"foundations",marks:"3",tier:"TIER 3",title:"Nunnally\u2019s Four Types of Traits for Measurement",
front:"According to Nunnally (1979), what four broad types of traits does personality measurement aim to study?",
back:`<p><strong>Nunnally (1979):</strong> Personality measurement aims at studying <strong>four broad types of traits</strong>:</p><ol><li><strong>Social traits</strong> — determine how persons interact with others in society. Examples: friendliness, honesty, dominance, responsibility, shyness. Includes temperament and character traits.</li><li><strong>Motives</strong> — non-biological drives: need to earn money, need for achievement, need for affiliation, aggression. These constitute <em>personality dynamics</em>.</li><li><strong>Personal conceptions</strong> — people's attitude toward self and others, values, interests.</li><li><strong>Adjustment</strong> — establishment of satisfactory relationship representing harmony, conformance, adaptation. Process of finding and adopting suitable modes of behaviour. Includes freedom from emotional worries/instability.</li></ol><p><strong>Important:</strong> These four types are <em>correlated with each other</em> (not independent). E.g., dominance (social trait) influences motives, personal conceptions, and adjustment.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Nunnally (1979)</span><span class="tag">social traits</span><span class="tag">motives/personality dynamics</span><span class="tag">personal conceptions</span><span class="tag">adjustment</span><span class="tag">correlated traits</span></div>`},

// === ASSESSMENT ===
{theme:"assessment",marks:"6-10",tier:"TIER 1",title:"16 PF \u2014 Sixteen Personality Factor Questionnaire",
front:"Describe the 16 PF. Who developed it? What are source traits? How is it used?",
back:`<p><strong>Cattell (1995)</strong> [also Cattell & Kline, 1977]: Used factor analysis to discover <strong>16 source traits</strong> of normal personality. Later determined there might be another 7 → total 23.</p><p>The 16 PF is based on just 16 source traits. These are seen as <em>trait dimensions or continuums</em> — two opposite traits at each end with many possible degrees.</p><p><strong>16 Source Traits:</strong> Warmth, Reasoning, Emotional Stability, Dominance, Liveliness, Rule-Consciousness, Social Boldness, Sensitivity, Vigilance, Abstractness, Privateness, Apprehension, Openness to Change, Self-Reliance, Perfectionism, Tension.</p><p><strong>Usage:</strong> Scores are plotted on a graph to provide a <em>personality profile</em> — used for counseling and employment/promotion decisions.</p><p><strong>Historical firsts:</strong> Galton (1880) — first attempt to measure personality through questionnaire. Woodworth (1918) — first systematic personality inventory (Personal Data Sheet, 116 questions, WWI screening).</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Cattell (1995)</span><span class="tag">16 PF</span><span class="tag">16 source traits</span><span class="tag">trait dimensions/continuums</span><span class="tag">personality profile</span><span class="tag">Galton (1880)</span><span class="tag">Woodworth (1918)</span></div>`},
{theme:"assessment",marks:"3",tier:"TIER 2",title:"MBTI \u2014 Myers-Briggs Type Indicator (Assessment)",
front:"Describe the MBTI as an assessment tool. What four dimensions does it measure? How many types are possible?",
back:`<p><strong>MBTI</strong> — based on Carl Jung's theory of personality types. Commercially available questionnaire; widely used in business and training.</p><p><strong>Four dimensions:</strong></p><ul><li><strong>Sensing/Intuition (S/I):</strong> Sensing people rely on physical senses; detail-oriented; work with known facts. Intuitive people look for patterns, trust hunches; use metaphors/analogies.</li><li><strong>Thinking/Feeling (T/F):</strong> Thinkers use logic, analysis. Feeling types use personal values and emotional reactions.</li><li><strong>Introversion/Extraversion (I/E):</strong> Classic dimension from Jung; in nearly all personality theories.</li><li><strong>Perceiving/Judging (P/J):</strong> Perceiving = adaptable, spontaneous, curious. Judging = action-oriented, decisive.</li></ul><p>Combined → <strong>16 personality types</strong> (4×4): ISTJ, ISTP, ISFP, ISFJ, ESTJ, ESTP, ESFP, ESFJ, INTJ, INTP, INFP, INFJ, ENTJ, ENTP, ENFP, ENFJ.</p><p>Used to help people know careers for which they may best be suited.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">MBTI</span><span class="tag">Jung</span><span class="tag">S/I, T/F, I/E, P/J</span><span class="tag">16 personality types</span><span class="tag">career assessment</span></div>`},

// === TRAIT THEORIES ===
{theme:"trait",marks:"10",tier:"TIER 2",title:"Big Five \u2014 Big Five vs FFM Distinction",
front:"What is the difference between the Big Five and the Five-Factor Model (FFM)? What are the theoretical perspectives?",
back:`<p><strong>Big Five</strong> — a <em>taxonomy</em> of personality traits; empirically based phenomenon, NOT a theory. Derived via factor analysis of trait ratings. Associated with <strong>Lew Goldberg</strong> and the <em>lexical hypothesis</em>. <strong>Phenotypic</strong>; no stance on causation. Measured as circular structure. Questionnaires: Big Five Markers / IPIP. 5th factor called "Intellect/Imagination."</p><p><strong>Five-Factor Model (FFM)</strong> — more theoretical framework. Associated with <strong>McCrae & Costa</strong> and questionnaire studies. <strong>Biosocial</strong> — both genetic and environmental. Measured <em>hierarchically</em> (facets → domains). Questionnaire: <strong>NEO PI-R</strong>. 5th factor called "Openness to Experience."</p><p><strong>Theoretical perspectives on Big Five:</strong></p><ul><li><strong>Interpersonal Theory</strong> (Sullivan, 1953; Wiggins & Trapnell, 1996): Big Five describe enduring patterns of interpersonal situations</li><li><strong>Socioanalytic Theory</strong> (Hogan, 1996): traits are socially constructed; about <em>reputation</em></li><li><strong>Evolutionary</strong> (D.M. Buss, 1996): "difference detecting mechanisms" for survival/reproduction</li><li><strong>Five-Factor Theory (FFT)</strong> (McCrae & Costa, 1996): Big Five as causal dispositions; basic tendencies (stable) vs characteristic adaptations (changeable)</li><li><strong>Social Investment Theory</strong> (Roberts): interactionist — environmental + biological</li></ul>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Big Five vs FFM</span><span class="tag">Goldberg vs McCrae & Costa</span><span class="tag">lexical vs questionnaire</span><span class="tag">phenotypic vs biosocial</span><span class="tag">FFT — basic tendencies vs characteristic adaptations</span><span class="tag">Hogan — reputation</span><span class="tag">Buss — difference detecting mechanisms</span></div>`},
{theme:"trait",marks:"6-10",tier:"TIER 1",title:"Eysenck \u2014 Heredity, Environment & Psychopathology",
front:"How does Eysenck explain the link between personality and psychopathology? What about heredity vs environment?",
