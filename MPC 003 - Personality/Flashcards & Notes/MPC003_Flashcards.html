back:`<p><strong>Eysenck:</strong> Psychological disorders arise from combined <em>interaction of personality traits + nervous system functioning</em>.</p><p><strong>Link to psychopathology:</strong></p><ul><li><strong>High Introversion + High Neuroticism</strong> → prone to <em>anxiety disorders</em> (phobias, obsessions, compulsions)</li><li><strong>High Extraversion + High Neuroticism</strong> → at risk for <em>psychopathic (antisocial) disorders</em></li></ul><p>Disorders do NOT occur automatically from genetic predisposition — predispositions interact with environment/situation to produce disorders.</p><p><strong>Biological basis:</strong></p><ul><li><strong>Extraversion:</strong> ARAS (Ascending Reticular Activating System) → cortical arousal. Introverts have <em>innately higher arousal</em> → more sensitive to stimulation. <strong>Yerkes-Dodson Law</strong> (inverted-U: arousal vs performance).</li><li><strong>Neuroticism:</strong> Visceral brain / limbic system (hippocampus, amygdala, septum, hypothalamus) → emotionality. Neurotics have lower thresholds.</li><li><strong>Psychoticism:</strong> Gonadal hormones (testosterone) and MAO (monoamine oxidase). Low MAO = vulnerability marker.</li></ul><p><strong>Aleksandrov & Shchukina (1992):</strong> Neurophysiological dynamics supported varying curability of patients with different character accentuations (e.g., hysteroid type = more resistant to psychotherapy).</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">anxiety disorders (introvert + neurotic)</span><span class="tag">psychopathic disorders (extravert + neurotic)</span><span class="tag">ARAS</span><span class="tag">Yerkes-Dodson Law</span><span class="tag">limbic system</span><span class="tag">MAO</span><span class="tag">character accentuation</span><span class="tag">Aleksandrov & Shchukina (1992)</span></div>`},

// === HUMANISTIC ===
{theme:"humanistic",marks:"6",tier:"TIER 1",title:"Humanistic Psychology \u2014 Overview & Third Force",
front:"What is humanistic psychology? Why is it called the 'Third Force'? What are its central themes?",
back:`<p><strong>Humanistic psychology</strong> = theories that focus on the <em>entire person</em>, emphasise that persons are inherently good with unique attributes for greatness. Also called <em>organismic</em> or <em>person-centered</em> theories.</p><p><strong>"The Third Force"</strong> (Maslow's term) — to distinguish from:</p><ul><li><strong>Psychodynamic Approach</strong> (study of mental illness/negative side, dominant in 1950s clinical psychology)</li><li><strong>Behaviourist Approach</strong> (reduces behaviour to statistical correlations between stimuli, responses, traits)</li></ul><p>Humanistic psychology tries to help people develop — make them more competent, aware, happier — toward "optimal" mental health.</p><p><strong>Central themes:</strong></p><ul><li>Drive toward <em>self-actualisation</em> (realising full potential)</li><li>Personal growth</li><li>Openness to experience</li><li>Living in the present</li><li>Personal responsibility</li><li>Inherent goodness of people</li></ul><p><strong>Unit of analysis:</strong> Perceived reality. <strong>Offshoots:</strong> Positive psychology (Seligman, 2000) + coaching psychology.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">Third Force</span><span class="tag">humanistic psychology</span><span class="tag">self-actualisation</span><span class="tag">perceived reality</span><span class="tag">positive psychology (Seligman)</span><span class="tag">person-centered</span><span class="tag">holistic approach</span></div>`},

// === ASSESSMENT ===
{theme:"assessment",marks:"3",tier:"TIER 2",title:"NEO-PI-R \u2014 Revised NEO Personality Inventory",
front:"Describe the NEO-PI-R. Who developed it? How many items and facets? What does it measure?",
back:`<p><strong>Costa & McCrae (1992):</strong> NEO-PI-R = Revised NEO Personality Inventory. Based on the <strong>Five-Factor Model</strong>.</p><p>Originally assessed only N, E, O; later added A and C (Agreeableness and Conscientiousness).</p><p><strong>Structure:</strong> Each of the five dimensions defined by <strong>6 facets</strong>. Each facet measured by <strong>8 items</strong>. Total = <strong>240 items</strong>.</p><p><strong>Measures the Big Five (OCEAN):</strong></p><ul><li><strong>N</strong>euroticism (6 facets: anxiety, hostility, depression, self-consciousness, impulsiveness, vulnerability)</li><li><strong>E</strong>xtraversion (6 facets: warmth, gregariousness, assertiveness, activity, excitement-seeking, positive emotions)</li><li><strong>O</strong>penness to Experience (6 facets: fantasy, aesthetics, feelings, actions, ideas, values)</li><li><strong>A</strong>greeableness (6 facets: trust, straightforwardness, altruism, compliance, modesty, tender-mindedness)</li><li><strong>C</strong>onscientiousness (6 facets: competence, order, dutifulness, achievement striving, self-discipline, deliberation)</li></ul><p>Most widely used personality inventory. Commercial — permission/payment required.</p><p><strong>NEO-FFI</strong> — 60-item truncated version measuring only the five factors (no facets).</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">NEO-PI-R</span><span class="tag">Costa & McCrae (1992)</span><span class="tag">240 items</span><span class="tag">6 facets per dimension</span><span class="tag">8 items per facet</span><span class="tag">OCEAN</span><span class="tag">NEO-FFI (60 items)</span></div>`},
{theme:"foundations",marks:"3-6",tier:"TIER 1",title:"Nomothetic vs Idiographic Approaches to Personality",
front:"Contrast the nomothetic and idiographic approaches to personality. Who are the key theorists of each? What methods does each use?",
back:`<p><strong>Nomothetic approach:</strong> Seeks general laws applicable to all people. Personality is constant, hereditary, resistant to change; minimal environmental influence. Based on quantitative methods: experiments, correlation, psychometric testing, self-report questionnaires. <strong>Key theorists:</strong> Cattell, Eysenck — use large samples and statistical analysis.</p><p><strong>Idiographic approach:</strong> Focuses on the unique individual in depth. Each person is a combined system independently analysed scientifically. No general laws beyond the individual. <strong>Key theorists:</strong> Allport (personal dispositions, case studies), Freud (single-case analysis). <strong>Methods:</strong> case studies, informal interviews, unstructured observation, personal documents, autobiographies.</p><p><strong>Allport’s dual role:</strong> He identified the nomothetic approach to testing (1934) but promoted the idiographic approach for understanding individuals. Common traits = nomothetic; Individual/Personal dispositions = idiographic. Each person has a unique pattern of cardinal, central, and secondary traits requiring individual examination.</p><p><strong>Complementary approach:</strong> Most modern personality researchers use both — nomothetic for establishing general principles and idiographic for rich, in-depth understanding of specific cases.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">nomothetic</span><span class="tag">idiographic</span><span class="tag">quantitative vs qualitative</span><span class="tag">Allport (1934)</span><span class="tag">Cattell/Eysenck</span><span class="tag">general laws</span><span class="tag">unique individual</span><span class="tag">case studies</span><span class="tag">common vs individual traits</span></div>`},

// === ASSESSMENT ===
{theme:"assessment",marks:"3-6",tier:"TIER 2",title:"Interview Method as a Personality Assessment Tool",
front:"Describe the interview method for personality assessment. What are the types, strengths, and weaknesses? What is the halo effect?",
back:`<p><strong>Definition:</strong> One of the oldest and most widely used methods. The personologist obtains information through face-to-face dialogue by asking relevant questions and listening to answers.</p><p><strong>Types:</strong></p><ul><li><strong>Structured interview:</strong> Questions carefully worded and presented in prescribed order. General/innocuous questions first, personal/threatening last (White & Speisman, 1982). Preferred in research settings.</li><li><strong>Unstructured interview:</strong> Questions framed to allow considerable latitude. Interviewer may probe deeper or abandon a line of questioning. Preferred in therapeutic/clinical settings.</li><li><strong>Semi-structured:</strong> Combination of both.</li></ul><p><strong>Strengths:</strong> Highly skilled interviewer yields extremely valuable data about life situations, self-perception, anxiety levels, future plans, job satisfaction. Rapport building. Follow-up possible. Rich personality data.</p><p><strong>Weaknesses:</strong> Highly subjective; theoretical biases of interviewer influence results. <strong>Halo effect:</strong> tendency to allow positive characteristics of a client to influence assessments of other behaviour/statements. Interviewer’s personality can influence respondent’s truthfulness and disclosure. May lead to withholding or distorting vital information. Issues of reliability and validity arise.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">structured interview</span><span class="tag">unstructured interview</span><span class="tag">halo effect</span><span class="tag">White & Speisman (1982)</span><span class="tag">face-to-face dialogue</span><span class="tag">rapport</span><span class="tag">subjectivity</span></div>`},

// === TYPE THEORIES ===
{theme:"type",marks:"3",tier:"TIER 2",title:"Introvert vs Extrovert \u2014 Eysenck\u2019s Type Dimension",
front:"Describe the key behavioural and biological differences between introverts and extraverts according to Eysenck. What is the Lemon Drop Test?",
back:`<p><strong>Eysenck’s arousal theory:</strong> Extraversion-Introversion dimension is biologically based via Ascending Reticular Activating System (ARAS).</p><ul><li><strong>Introverts:</strong> Innately higher baseline cortical arousal. More sensitive to stimulation — avoid excessive external stimuli. Prefer theoretical/scientific vocations. Work better in morning. Higher arousal in mornings. Attain higher college grades. Students withdrawing for psychiatric reasons tend to be introverts.</li><li><strong>Extraverts:</strong> Innately lower baseline cortical arousal. Seek stimulation. Prefer people-oriented jobs. Work better in afternoon. Greater pain tolerance. Excitement enhances performance (vs interferes with introverts’). Students withdrawing for academic reasons tend to be extraverts.</li></ul><p><strong>Yerkes-Dodson Law:</strong> Inverted-U relationship between arousal and performance. Introverts perform best at lower stimulation; extraverts at higher.</p><p><strong>Lemon Drop Test (Corcoran, 1964):</strong> 4 drops of lemon juice on tongue. Introverts secrete almost twice the saliva as extraverts — demonstrating different physiological functioning controlled by ARAS.</p><p><strong>Wilson (1978)</strong> comprehensively reviewed these differences.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">ARAS</span><span class="tag">cortical arousal</span><span class="tag">Yerkes-Dodson Law</span><span class="tag">Lemon Drop Test</span><span class="tag">Corcoran (1964)</span><span class="tag">Wilson (1978)</span><span class="tag">innate arousal differences</span></div>`},

// === LEARNING & COGNITIVE ===
{theme:"learning",marks:"10",tier:"TIER 2",title:"Social-Cognitive Theory of Personality",
front:"Describe the social-cognitive theory of personality. What is reciprocal determinism? What are Mischel\u2019s cognitive person variables? How does it compare with the behavioural approach?",
back:`<p><strong>Bandura</strong> renamed Social Learning Theory as <em>Social Cognitive Theory</em>. Emphasises cognitive processes in personality development.</p><p><strong>Triadic reciprocal determinism:</strong> Three interacting determinants influence each other bidirectionally: <strong>P</strong> (Personal/cognitive factors) ↔ <strong>B</strong> (Behaviour) ↔ <strong>E</strong> (Environment). “People are both products and producers of their environment.”</p><p><strong>Self-efficacy</strong> (Bandura, 1995): “Belief in one’s capabilities to organise and execute courses of action required to manage prospective situations.” Four sources: mastery experiences (most effective), social modeling, social persuasion, psychological responses.</p><p><strong>Mischel’s cognitive person variables (5):</strong> (1) Encoding strategies — how person construes events. (2) Expectancies — what outcomes person expects. (3) Subjective values — preferences. (4) Self-regulatory systems and plans. (5) Competencies — what person can do.</p><p><strong>Comparison with behavioural approach:</strong> Social-cognitive theory goes beyond S-R — includes cognition, self-regulation, and observational/vicarious learning. Behavioural approach ignores internal mental processes. Mischel (1968) initiated person-situation debate.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">social-cognitive theory</span><span class="tag">triadic reciprocal determinism</span><span class="tag">self-efficacy</span><span class="tag">Mischel’s cognitive person variables</span><span class="tag">Bandura</span><span class="tag">P-B-E interaction</span><span class="tag">person-situation debate</span></div>`},

// === HUMANISTIC ===
{theme:"humanistic",marks:"3",tier:"TIER 3",title:"The Self \u2014 Real and Ideal Self (Rogers)",
front:"Describe Rogers\u2019 concepts of the self, real self, and ideal self. What is congruence and incongruence? What are the implications for psychological well-being?",
back:`<p><strong>Self</strong> = organised, consistent set of perceptions of “who I am.” Develops through interactions with environment, especially with others. Central concept in Rogers’ person-centered theory.</p><p><strong>Real self:</strong> Who/what we actually are — the genuine person including strengths, weaknesses, actual experiences.</p><p><strong>Ideal self:</strong> Who we would like to be — our aspirations, goals, and valued attributes.</p><p><strong>Congruence</strong> (overlap between real and ideal self) = healthy, well-adjusted personality. Harmony, self-acceptance, psychological well-being.</p><p><strong>Incongruence</strong> (large gap between real and ideal self) = anxiety, defensiveness, poor adjustment. Results from conditional positive regard. Larger discrepancy = more psychological distress.</p><p><strong>Measurement:</strong> Q-sort technique — sorting statements about self into categories; measuring real-ideal discrepancy.</p><p><strong>Unconditional positive regard</strong> helps bridge the gap — acceptance without conditions fosters congruence.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">real self</span><span class="tag">ideal self</span><span class="tag">congruence</span><span class="tag">incongruence</span><span class="tag">Rogers</span><span class="tag">Q-sort technique</span><span class="tag">unconditional positive regard</span></div>`},

// === PSYCHODYNAMIC ===
{theme:"psychodynamic",marks:"3",tier:"TIER 3",title:"Developmental Epochs (Sullivan)",
front:"List and describe Sullivan\u2019s seven developmental epochs. Who are the significant others at each stage?",
back:`<p><strong>Seven developmental epochs</strong> (unlike Freud, timing dictated by social environment, not biology):</p><ol><li><strong>Infancy (0–1 yr):</strong> Mother/mothering one. Learns via empathic relationship. Anxiety transmitted from caretaker. Euphoria = complete absence of anxiety.</li><li><strong>Childhood (1–5 yr):</strong> Parents. Language develops. Socialisation. Transition to syntaxic mode.</li><li><strong>Juvenile era (6–8 yr):</strong> Playmates of same social status. Learns competition, compromise, cooperation. First real social experience outside family.</li><li><strong>Pre-adolescence (9–12 yr):</strong> Single best friend (chum). Capacity for intimacy emerges. Chum validates personal worth. Crucial for mental health — deficits here lead to later problems.</li><li><strong>Early adolescence (13–17 yr):</strong> Multiple friends, opposite-sex interest. Genital interest emerges. Conflict between intimacy and lust.</li><li><strong>Late adolescence (18–22 yr):</strong> Society at large. Integration into adult society. Establish preferred patterns of interpersonal relations.</li><li><strong>Adulthood (23+ yr):</strong> Spouse, significant others. Established interpersonal relationships. Productive connection with society.</li></ol><p><strong>Key concept:</strong> “Personality is the relatively enduring pattern of recurrent interpersonal situations.” The <em>self-system</em> develops to protect against anxiety.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">seven epochs</span><span class="tag">mothering one</span><span class="tag">chumship</span><span class="tag">euphoria</span><span class="tag">interpersonal development</span><span class="tag">empathic relationship</span></div>`},

// === ASSESSMENT ===
{theme:"assessment",marks:"6",tier:"TIER 3",title:"Case Study Method in Personality Assessment",
front:"Describe the case study method. What is its purpose? What are its types, strengths, and weaknesses?",
back:`<p><strong>Definition:</strong> Detailed study of a single individual’s behaviour over an extended period. Non-experimental, descriptive research. Preserves the unitary character of the social object studied. Unit may be a person, family, social group, institution, or community (Good & Hatt, 1981).</p><p><strong>Purpose:</strong> Understand important aspects of the life cycle of a unit. Deep analysis and interpretation of interactions between factors influencing change/growth. Longitudinal approach.</p><p><strong>Types:</strong></p><ul><li><strong>By unit:</strong> Individual case study vs Community case study.</li><li><strong>By purpose:</strong> Deviant case analysis (reading backward to deduce conditions producing differences) vs Isolated clinical case analysis (popular in psychoanalysis; e.g., Freud’s study of “Little Hans”).</li></ul><p><strong>Historical figures:</strong> Frederic Le Play (1806–1882) — introduced into social sciences (family budgets). Herbert Spencer (1820–1882) — ethnographic studies. William Healy — juvenile delinquency. Freud — psychodynamic theory entirely based on intensive single-case study. Carl Rogers — phenomenological approach.</p><p><strong>Strengths:</strong> Rich account of complexities and idiosyncrasies. Only way to study rare phenomena. Preliminary research strategy for generating hypotheses.</p><p><strong>Weaknesses:</strong> Cannot establish cause-and-effect with certainty. Limited generalisability. Data may be retrospective/second-hand and distorted by time. Conclusions may reflect personal biases of investigator. Single case does not provide firm basis for deriving general principles.</p>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">case study</span><span class="tag">Le Play (1806-1882)</span><span class="tag">Freud’s Little Hans</span><span class="tag">deviant case analysis</span><span class="tag">isolated clinical case analysis</span><span class="tag">longitudinal</span><span class="tag">limited generalisability</span></div>`},
{theme:"foundations",marks:"6",tier:"TIER 3",title:"Neurophysiological Basis of Traits and Types",
front:"Describe the neurophysiological basis of personality traits and types. What is the role of ARAS and the limbic system? What psychophysiological research supports this?",
back:`<p><strong>Eysenck’s biological basis of personality:</strong> Superfactors are rooted in differences in brain functioning and nervous system physiology.</p><p><strong>Extraversion — ARAS (Ascending Reticular Activating System):</strong> Brain-stem structure regulating cortical arousal. <strong>Introverts</strong> innately higher baseline cortical arousal → greater sensitivity to external stimulation. <strong>Extraverts</strong> lower baseline arousal → need more external stimulation. <em>Yerkes-Dodson Law:</em> inverted-U arousal–performance relationship.</p><p><strong>Neuroticism — Limbic system:</strong> Includes hippocampus, amygdala, septum, hypothalamus. High-N individuals have <em>lower activation thresholds</em> in visceral brain → more emotionally reactive, anxious, unstable. Low-N: emotionally stable, higher thresholds.</p><p><strong>Psychoticism — Hormonal & neurotransmitter:</strong> Linked to gonadal hormones (testosterone) and MAO (monoamine oxidase). Low MAO = vulnerability marker.</p><p><strong>Psychophysiological evidence:</strong></p><ul><li><strong>Lemon Drop Test</strong> (Corcoran, 1964): Introverts secrete ~2× more saliva.</li><li><strong>EEG studies:</strong> Introverts show higher alpha suppression.</li><li><strong>Aleksandrov & Shchukina (1992):</strong> Neurophysiological dynamics influence curability; different character accentuations vary in psychotherapeutic outcomes (e.g., hysteroid type more resistant).</li><li><strong>Eysenck (1953):</strong> One hour paper-and-pencil testing = results comparable to 2.5-day assessment centre.</li></ul>
<div class="key-terms"><div class="key-terms-title">Key terms for marks</div><span class="tag">ARAS</span><span class="tag">limbic system</span><span class="tag">cortical arousal</span><span class="tag">Yerkes-Dodson Law</span><span class="tag">MAO</span><span class="tag">Lemon Drop Test</span><span class="tag">Aleksandrov & Shchukina (1992)</span><span class="tag">character accentuation</span></div>`},
];

let currentIndex=0,filteredCards=[...cards],isShuffled=false,cardFlipped=false;
function renderCard(){const c=filteredCards[currentIndex];if(!c)return;const marksClass=c.marks>=10?"marks-high":c.marks>=6?"marks-med":"marks-low";const tierClass=c.tier==="TIER 1"?"tier-1":c.tier==="TIER 2"?"tier-2":"tier-3";document.getElementById("cardFront").innerHTML=`<div class="card-label">${getThemeLabel(c.theme)}</div><div class="card-title">${c.title}</div><div class="marks-badge ${marksClass}">Likely ${c.marks} Marks <span class="tier-badge ${tierClass}">${c.tier}</span></div><div class="card-body"><p>${c.front}</p></div>`;document.getElementById("cardBack").innerHTML=`<div class="card-label back-label">Answer</div><div class="card-title">${c.title}</div><div class="marks-badge ${marksClass}">Likely ${c.marks} Marks <span class="tier-badge ${tierClass}">${c.tier}</span></div><div class="card-body">${c.back}</div>`;document.getElementById("currentNum").textContent=currentIndex+1;document.getElementById("totalNum").textContent=filteredCards.length;document.getElementById("progressFill").style.width=((currentIndex+1)/filteredCards.length*100)+"%";cardFlipped=false;document.getElementById("flashcard").classList.remove("flipped");document.getElementById("cardFront").scrollTop=0;document.getElementById("cardBack").scrollTop=0;}
function getThemeLabel(t){const m={foundations:"Foundations & Determinants",type:"Type Theories",trait:"Trait Theories",psychodynamic:"Psychodynamic Theories",learning:"Learning & Cognitive Theories",humanistic:"Humanistic Theories",assessment:"Assessment Methods"};return m[t]||t;}
function flipCard(){cardFlipped=!cardFlipped;document.getElementById("flashcard").classList.toggle("flipped");}
function nextCard(){if(currentIndex<filteredCards.length-1){currentIndex++;renderCard();}}
function prevCard(){if(currentIndex>0){currentIndex--;renderCard();}}
function resetCard(){cardFlipped=false;document.getElementById("flashcard").classList.remove("flipped");}
function toggleShuffle(){isShuffled=!isShuffled;document.getElementById("shuffleIndicator").classList.toggle("active",isShuffled);if(isShuffled){filteredCards=[...filteredCards].sort(()=>Math.random()-.5);}else{applyFilter();}currentIndex=0;renderCard();}
function applyFilter(){const theme=document.getElementById("themeFilter").value;filteredCards=theme==="all"?[...cards]:cards.filter(c=>c.theme===theme);if(isShuffled)filteredCards=[...filteredCards].sort(()=>Math.random()-.5);currentIndex=0;renderCard();}
document.getElementById("themeFilter").addEventListener("change",()=>{isShuffled=false;document.getElementById("shuffleIndicator").classList.remove("active");applyFilter();});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")nextCard();else if(e.key==="ArrowLeft")prevCard();else if(e.key===" "){e.preventDefault();flipCard();}else if(e.key==="s"||e.key==="S")toggleShuffle();});
renderCard();
</script>
