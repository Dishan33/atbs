<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPC-004 Flashcards</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"><style>:root{--ink:#101827;--panel:#203150;--paper:#f8f2e8;--muted:#adbbcf;--sun:#f5be55;--line:rgba(248,242,232,.14)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 84% -10%,#345178 0,transparent 32rem),var(--ink);color:var(--paper);font-family:'DM Sans',sans-serif;min-height:100svh}.top{border-bottom:1px solid var(--line);padding:18px clamp(18px,5vw,56px)}.top a{color:var(--sun);font:.7rem 'DM Mono',monospace;text-decoration:none}.top h1{font:clamp(2rem,5vw,4.4rem)/.9 'Instrument Serif',Georgia,serif;margin:12px 0 0}.top h1 span{color:var(--sun)}main{max-width:820px;margin:auto;padding:28px 18px 50px}.filters{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.filters button,.nav button{background:transparent;border:1px solid var(--line);border-radius:99px;color:var(--muted);cursor:pointer;font:500 .68rem 'DM Mono',monospace;padding:8px 11px;white-space:nowrap}.filters button.active{background:var(--sun);border-color:var(--sun);color:var(--ink)}.count{color:var(--muted);font-size:.78rem;margin:10px 0}.card{background:linear-gradient(145deg,#2a4675,#1c2d4b);border:1px solid var(--line);border-radius:22px;cursor:pointer;min-height:390px;padding:clamp(25px,6vw,58px)}.tag{color:var(--sun);font:500 .7rem 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase}.q{font:clamp(2rem,5vw,3.8rem)/1.02 'Instrument Serif',Georgia,serif;margin:30px 0}.a{display:none;color:var(--paper);font-size:1rem;line-height:1.7;max-width:650px}.card.flip .q{display:none}.card.flip .a{display:block}.hint{color:var(--muted);font-size:.74rem;margin-top:30px}.nav{display:flex;justify-content:space-between;margin-top:14px}.nav button:last-child{background:var(--sun);border-color:var(--sun);color:var(--ink)}@media(max-width:520px){.card{min-height:420px;padding:28px 22px}.q{font-size:2.35rem}}</style></head><body><header class="top"><a href="../MPC004_Dashboard.html">← MPC-004 Study Desk</a><h1>Active recall for <span>social life.</span></h1></header><main><div class="filters" id="filters"></div><p class="count" id="count"></p><article class="card" id="card" tabindex="0" role="button"><p class="tag" id="tag"></p><h2 class="q" id="q"></h2><p class="a" id="a"></p><p class="hint" id="hint">Tap to reveal the answer</p></article><div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div></main><script>
const cards=[
['Foundations','What is social psychology?','The scientific study of how people think about, influence and relate to one another in social contexts. It studies the individual in relation to actual, imagined or implied others.'],['Foundations','Name four levels of analysis in social psychology.','Individual, interpersonal, group and societal/cultural levels. A strong answer shows how one event can be explained at more than one level.'],['Foundations','Why is social psychology called scientific?','It uses systematic observation, theory, hypotheses, measurement and methods such as experiments, surveys, observation and correlation to test explanations.'],['Foundations','What is an experiment?','A method that manipulates an independent variable, controls relevant extraneous variables and observes its effect on a dependent variable. Its main strength is causal inference.'],['Foundations','What can correlation establish—and not establish?','It establishes association between variables, including direction and strength. It cannot by itself establish causation because directionality and third variables remain possible.'],['Foundations','What is ethnography?','A qualitative method involving sustained study of people in their natural social and cultural setting, often through observation, participation, field notes and interpretation.'],['Foundations','What is informed consent?','A participant’s voluntary agreement after receiving understandable information about the study, procedures, possible risks, rights and withdrawal.'],['Foundations','Why is debriefing used?','To explain the study after participation, particularly if deception was used; it addresses distress, restores informed understanding and allows questions.'],
['Perception','What is person perception?','The process of forming impressions and judgements about other people from their appearance, behaviour, social categories, verbal information and context.'],['Perception','What is a schema?','An organised knowledge structure that guides attention, interpretation and memory. Schemas make processing efficient but can also create bias and self-fulfilling expectations.'],['Perception','What is a prototype?','A mental representation of the most typical features of a category. People compare new information with the prototype when categorising others or events.'],['Perception','What is the primacy effect in impression formation?','Information received first has a disproportionate impact on an overall impression because it shapes how later information is interpreted.'],['Perception','What is the halo effect?','A tendency for one favourable or unfavourable trait—such as attractiveness or perceived competence—to influence judgements of unrelated traits.'],['Perception','State the fundamental attribution error.','The tendency to overestimate dispositional causes and underestimate situational causes when explaining other people’s behaviour.'],['Perception','What is actor-observer bias?','Actors more often explain their own behaviour through situations; observers more often explain the actor’s behaviour through stable personal traits.'],['Perception','What is cognitive algebra?','An approach to impression formation in which people combine pieces of information, often by averaging or weighting them, to form an overall evaluation.'],
['Influence','What is social influence?','A change in thought, feeling, attitude or behaviour resulting from interaction with others, whether the influence is intentional or unintentional.'],['Influence','Define conformity.','A change in behaviour, judgement or belief in response to real or imagined group pressure.'],['Influence','What did Asch’s research demonstrate?','People may publicly agree with a unanimous majority even when its judgement is clearly wrong. A dissenter sharply reduces conformity.'],['Influence','Differentiate normative and informational influence.','Normative influence aims at acceptance or avoidance of rejection; informational influence treats others as evidence about reality, especially under ambiguity.'],['Influence','What is compliance?','A change in behaviour in response to a direct request, without necessarily changing private attitudes.'],['Influence','Name Cialdini’s compliance principles.','Reciprocation, commitment/consistency, social validation, liking, authority/credibility and scarcity.'],['Influence','What is foot-in-the-door?','Agreement to a small request increases later agreement to a larger related request, partly through consistency and self-perception.'],['Influence','What is door-in-the-face?','A large request likely to be refused is followed by a smaller request; the concession can create pressure to reciprocate.'],['Influence','What is low-ball technique?','Securing agreement to an attractive offer and then increasing its costs or removing advantages after commitment has formed.'],['Influence','What is obedience?','Compliance with a command from a person perceived as having legitimate authority.'],['Influence','List factors that increase obedience.','Legitimate authority, institutional prestige, gradual commitment, surveillance, proximity of authority, diffusion of responsibility and absence of dissent.'],
['Attitudes','What are the ABC components of attitude?','Affective feelings, behavioural tendencies and cognitive beliefs/evaluations. They can align, but do not always do so perfectly.'],['Attitudes','What is attitude formation?','The development of an evaluation toward an object, person or issue through experience, learning, socialisation, modelling, group norms and communication.'],['Attitudes','What is Heider’s balance theory?','People prefer balanced relations among self, another person and an attitude object. Imbalance creates pressure to change an attitude or relation to restore consistency.'],['Attitudes','What is Katz’s functional theory?','Attitudes serve utilitarian, knowledge, value-expressive and ego-defensive functions. Persuasion works better when it addresses the function an attitude serves.'],['Attitudes','What is Bem’s self-perception theory?','When attitudes are weak or unclear, people infer them by observing their own behaviour and the conditions under which it occurred.'],['Attitudes','What factors influence attitude change?','Source credibility, message strength, emotional appeal, repetition, recipient involvement, social norms, direct experience and cognitive consistency pressures.'],
['Prejudice','Differentiate stereotype, prejudice and discrimination.','Stereotype: belief/generalisation about a group. Prejudice: usually negative attitude/evaluation. Discrimination: unequal behaviour or treatment based on group membership.'],['Prejudice','What maintains stereotypes?','Categorisation, selective attention, confirmation bias, social learning, segregated contact, institutional practices and self-fulfilling expectations.'],['Prejudice','What is prejudice reduction through contact?','Contact can reduce prejudice when groups have equal status, cooperative interaction, common goals and institutional support.'],['Prejudice','What is social categorisation?','The cognitive process of classifying self and others into groups. It simplifies social information but may exaggerate perceived differences between groups.'],['Prejudice','What is discrimination?','Behaviour that denies equal treatment, opportunities or respect to individuals because of their perceived group membership.'],
['Prosocial','What is prosocial behaviour?','Voluntary action intended to benefit another person, including helping, sharing, comforting, cooperating and volunteering.'],['Prosocial','What is altruism?','Helping motivated primarily by concern for another person’s welfare, rather than by expected external reward or self-benefit.'],['Prosocial','What is the empathy-altruism hypothesis?','Batson’s proposal that empathic concern can evoke an altruistic motivation to help another person.'],['Prosocial','What is bystander effect?','Helping can decrease when other bystanders are present because responsibility is diffused, the situation is ambiguous or people look to others for cues.'],['Prosocial','Differentiate cooperation and competition.','Cooperation coordinates action toward shared/compatible goals. Competition involves seeking limited or mutually exclusive outcomes.'],
['Attraction','Name common factors in interpersonal attraction.','Proximity, repeated exposure, similarity, reciprocal liking, physical attractiveness, competence, self-disclosure and situational context.'],['Attraction','What is reciprocity of liking?','We tend to like people who show that they like us, because their approval is rewarding and confirms a positive social evaluation.'],['Attraction','Why does similarity matter in attraction?','Similarity validates beliefs and values, supports prediction and communication, and often increases opportunities for shared activity.'],
['Aggression','Define aggression.','Behaviour intended to harm another person who is motivated to avoid that harm. It may be physical, verbal, direct, indirect, hostile or instrumental.'],['Aggression','What is frustration-aggression explanation?','Blocked goal-directed behaviour can produce frustration and readiness for aggression; modern accounts treat frustration as one contributor rather than an inevitable cause.'],['Aggression','How does social learning explain aggression?','People learn aggressive scripts and expectancies by observing models, seeing aggression rewarded and practising behaviour in reinforcing contexts.'],['Aggression','Name ways to reduce aggression.','Reduce provocation and aggressive cues, teach regulation and conflict skills, reward non-aggression, model prosocial responses and improve stressful environments.'],
['Conflict','What is social conflict?','Perceived incompatibility of goals, interests, values or resources between individuals or groups.'],['Conflict','Name major causes of conflict.','Scarce resources, incompatible goals, identity threat, unequal power, prejudice, misperception, poor communication and historical grievances.'],['Conflict','Name methods of conflict resolution.','Negotiation, mediation, cooperative superordinate goals, communication, perspective taking, fair procedures and institutional safeguards.'],
['Groups','What makes people a group rather than a crowd?','A group involves interaction, interdependence, shared goals or identity, membership recognition, norms, roles and some organisation; mere co-presence is insufficient.'],['Groups','What are Tuckman’s stages?','Forming, storming, norming, performing and adjourning. Groups may move nonlinearly rather than progressing rigidly.'],['Groups','What is group cohesion?','The strength of attraction, commitment and unity binding members to a group. It can support coordination but also suppress dissent if excessive.'],['Groups','What is social identity theory?','Tajfel and Turner proposed that group membership forms part of self-concept; categorisation, identification and comparison can produce in-group favouritism.'],['Crowds','Differentiate crowd and collective behaviour.','A crowd is a temporary gathering in proximity; collective behaviour is a broader category of relatively spontaneous group action outside routine institutions.'],['Crowds','What is emergent norm theory?','In ambiguous crowd situations, new norms may develop and guide behaviour; crowds are not assumed to be uniformly irrational.']
];
let topic='All',i=0,flip=false;const fs=document.getElementById('filters'),themes=['All',...new Set(cards.map(c=>c[0]))];const set=()=>cards.filter(c=>topic==='All'||c[0]===topic);function draw(){const x=set();if(i>=x.length)i=0;const c=x[i];flip=false;card.classList.remove('flip');tag.textContent=c[0];q.textContent=c[1];a.textContent=c[2];count.textContent=`Card ${i+1} of ${x.length} · ${topic}`;hint.textContent='Tap to reveal the answer'}themes.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.className=t==='All'?'active':'';b.onclick=()=>{topic=t;i=0;[...fs.children].forEach(x=>x.classList.toggle('active',x.textContent===t));draw()};fs.append(b)});const card=document.getElementById('card'),tag=document.getElementById('tag'),q=document.getElementById('q'),a=document.getElementById('a'),count=document.getElementById('count'),hint=document.getElementById('hint');card.onclick=()=>{flip=!flip;card.classList.toggle('flip',flip);hint.textContent=flip?'Tap to hide the answer':'Tap to reveal the answer'};card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();card.click()}};prev.onclick=()=>{i=(i-1+set().length)%set().length;draw()};next.onclick=()=>{i=(i+1)%set().length;draw()};draw();
</script></body></html>
