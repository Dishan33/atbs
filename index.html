<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c2a2a">
  <meta name="robots" content="noindex">
  <title>Roma Course — IGNOU MAPC</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #0d1117;
      --slate: #1c2a2a;
      --parchment: #e6d5b8;
      --muted: #988b78;
      --amber: #e9b44c;
    }

    * { box-sizing: border-box; }

    body {
      align-items: center;
      background: var(--ink);
      color: var(--parchment);
      display: flex;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100svh;
      padding: 24px;
    }

    main {
      border-left: 2px solid var(--amber);
      max-width: 34rem;
      padding: 1.5rem 1.75rem;
    }

    p { color: var(--muted); line-height: 1.55; margin: .5rem 0 1.25rem; }
    h1 { font-family: Georgia, serif; font-size: clamp(1.5rem, 6vw, 2.15rem); margin: 0; }
    h1 span { color: var(--amber); font-family: inherit; font-style: italic; font-weight: 400; }
    a { color: var(--amber); text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid var(--parchment); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Roma Course <span>— IGNOU MAPC</span></h1>
    <p>Opening your MPC-003 Personality study dashboard…</p>
    <a id="dashboard-link" href="MPC%20003%20-%20Personality/MPC003_Dashboard.html">Open the study dashboard</a>
  </main>
  <script>
    window.location.replace(document.getElementById('dashboard-link').href);
  </script>
</body>
</html>
