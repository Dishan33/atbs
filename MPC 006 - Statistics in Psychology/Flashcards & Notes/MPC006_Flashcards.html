<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPC-006 Flashcards</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght,400;0,600;0,700;1,400&family=Inter:wght;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#0f172a;--panel:#1e293b;--paper:#e2e8f0;--muted:#94a3b8;--sun:#60a5fa;--line:rgba(248,242,232,.14)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 84% -10%,#345178 0,transparent 32rem),var(--ink);color:var(--paper);font-family:Inter,sans-serif;min-height:100svh}.top{border-bottom:1px solid var(--line);padding:18px clamp(18px,5vw,56px)}.top a{color:var(--sun);font:.7rem Inter,monospace;text-decoration:none}.top h1{font:clamp(2rem,5vw,4.4rem)/.9 'Crimson Pro',Georgia,serif;margin:12px 0 0}.top h1 span{color:var(--sun)}main{max-width:820px;margin:auto;padding:28px 18px 50px}.filters{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.filters button,.nav button{background:transparent;border:1px solid var(--line);border-radius:99px;color:var(--muted);cursor:pointer;font:500 .68rem Inter,monospace;padding:8px 11px;white-space:nowrap}.filters button.active{background:var(--sun);border-color:var(--sun);color:var(--ink)}.count{color:var(--muted);font-size:.78rem;margin:10px 0}.card{background:linear-gradient(145deg,#2a4675,#1c2d4b);border:1px solid var(--line);border-radius:22px;cursor:pointer;min-height:390px;padding:clamp(25px,6vw,58px)}.tag{color:var(--sun);font:500 .7rem Inter,monospace;letter-spacing:.12em;text-transform:uppercase}.q{font:clamp(2rem,5vw,3.8rem)/1.02 'Crimson Pro',Georgia,serif;margin:30px 0}.a{display:none;color:var(--paper);font-size:1rem;line-height:1.7;max-width:650px}.card.flip .q{display:none}.card.flip .a{display:block}.hint{color:var(--muted);font-size:.74rem;margin-top:30px}.nav{display:flex;justify-content:space-between;margin-top:14px}.nav button:last-child{background:var(--sun);border-color:var(--sun);color:var(--ink)}@media(max-width:520px){.card{min-height:420px;padding:28px 22px}.q{font-size:2.35rem}}</style></head><body><header class="top"><a href="../MPC006_Dashboard.html">← MPC-006 Study Desk</a><h1>Recall the <span>decision rule.</span></h1></header><main><div class="filters" id="filters"></div><p class="count" id="count"></p><article class="card" id="card" tabindex="0" role="button" aria-label="Flip flashcard"><p class="tag" id="tag"></p><h2 class="q" id="q"></h2><div class="a" id="a"></div><p class="hint" id="hint">Tap to reveal the answer</p></article><div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div></main><script>
const cards=[
{t:'Foundations',q:'Descriptive versus inferential statistics?',a:'<b>Descriptive statistics</b> organise and summarise obtained data (tables, graphs, mean, median, SD). <b>Inferential statistics</b> use sample information to make a probability-based inference about a population.'},
{t:'Foundations',q:'What distinguishes parametric from non-parametric statistics?',a:'<b>Parametric tests</b> make assumptions about population parameters and usually require interval/ratio data, normality and related conditions. <b>Non-parametric tests</b> are distribution-free alternatives, useful with nominal/ordinal data or when parametric assumptions are not met.'},
{t:'Foundations',q:'Four levels of measurement?',a:'<b>Nominal:</b> categories only. <b>Ordinal:</b> ordered ranks. <b>Interval:</b> equal units but no true zero. <b>Ratio:</b> equal units with a meaningful zero. The scale constrains the statistics that can be used.'},
{t:'Foundations',q:'Measures of central tendency?',a:'<b>Mean</b> is the arithmetic average; <b>median</b> is the middle score; <b>mode</b> is the most frequent score. Use the median when an extreme score makes the mean misleading.'},
{t:'Foundations',q:'Measures of dispersion?',a:'<b>Range</b> is highest minus lowest score. <b>Variance</b> is average squared deviation. <b>Standard deviation</b> is the square root of variance and expresses typical spread in original-score units.'},
{t:'Foundations',q:'What is a frequency distribution?',a:'A systematic arrangement of scores showing how often each score or class interval occurs. It may be ungrouped (individual values) or grouped (class intervals).'},
{t:'Foundations',q:'What is a null hypothesis?',a:'A statement of no difference, no effect or no relationship in the population. Statistical testing assesses whether the observed result is sufficiently unlikely under this null hypothesis.'},
{t:'Foundations',q:'Type I and Type II errors?',a:'<b>Type I error (α):</b> rejecting a true null hypothesis. <b>Type II error (β):</b> failing to reject a false null hypothesis. Lowering α can make Type II error more likely unless power improves.'},
{t:'Foundations',q:'One-tailed versus two-tailed test?',a:'A <b>one-tailed</b> test predicts a direction and places the rejection region in one tail. A <b>two-tailed</b> test predicts a difference without direction and divides α across both tails.'},
{t:'Foundations',q:'What is the standard error of the mean?',a:'The SD of the sampling distribution of means. It indicates how precisely a sample mean estimates the population mean; it generally decreases as sample size increases.'},
{t:'Distribution',q:'Normal probability curve: key characteristics?',a:'Bell-shaped, symmetrical and unimodal; mean = median = mode at the centre; total area = 1.00; tails are asymptotic; its shape is defined by mean and standard deviation.'},
{t:'Distribution',q:'Skewness and kurtosis?',a:'<b>Skewness</b> is asymmetry of a distribution: a positive skew has a longer right tail. <b>Kurtosis</b> concerns peakedness/tail weight relative to a normal distribution.'},
{t:'Distribution',q:'Why is normal distribution important?',a:'It provides a model for interpreting relative standing, using areas under the curve, estimating probabilities and supporting many parametric procedures.'},
{t:'Correlation',q:'What does Pearson’s product-moment r describe?',a:'The direction and strength of a <b>linear</b> relationship between two quantitative variables. r ranges from −1 to +1; it does not itself establish causation.'},
{t:'Correlation',q:'Positive, negative and zero correlation?',a:'<b>Positive:</b> variables tend to increase together. <b>Negative:</b> one tends to decrease as the other increases. <b>Zero:</b> no linear association is evident.'},
{t:'Correlation',q:'What can distort Pearson r?',a:'Restricted range, unreliable measurement, influential outliers and curvilinearity can reduce or misrepresent the observed linear relationship.'},
{t:'Correlation',q:'When is Spearman’s rho appropriate?',a:'For ranked/ordinal data or when the relationship is assessed through ranks. It measures association between two ranked variables and is commonly called rank-order correlation.'},
{t:'Correlation',q:'Point-biserial versus phi coefficient?',a:'<b>Point-biserial</b> relates one genuine dichotomy and one continuous variable. <b>Phi</b> measures association between two genuine dichotomous variables.'},
{t:'Correlation',q:'Partial, part and multiple correlation?',a:'<b>Partial</b> correlation controls a third variable in both variables. <b>Part/semipartial</b> controls it in one variable. <b>Multiple</b> correlation relates one criterion to a set of predictors.'},
{t:'Correlation',q:'What is regression?',a:'A method for predicting one variable from another. The regression equation describes the best linear prediction; prediction is not proof of causation.'},
{t:'Mean differences',q:'When is a t test used?',a:'To test whether a mean difference is statistically significant, commonly for two independent groups or paired/dependent observations, under the relevant assumptions.'},
{t:'Mean differences',q:'What is one-way ANOVA?',a:'A parametric test for comparing means of three or more independent groups on one factor. It partitions variance into between-group and within-group components and uses an F ratio.'},
{t:'Mean differences',q:'What is two-way ANOVA?',a:'ANOVA with two independent variables. It tests each <b>main effect</b> and their <b>interaction effect</b>—whether the effect of one factor differs across levels of the other.'},
{t:'Mean differences',q:'What are degrees of freedom?',a:'The number of values free to vary after constraints are applied. They determine the relevant critical value for t, F and chi-square distributions.'},
{t:'Non-parametric',q:'When use Mann-Whitney U?',a:'To compare two <b>independent</b> groups with ranked/ordinal data or when parametric assumptions are unsuitable. Rank all scores, obtain rank sums and calculate U.'},
{t:'Non-parametric',q:'When use Wilcoxon matched-pairs signed-rank?',a:'For two <b>related</b> measurements or matched pairs. Rank the absolute paired differences, retain signs, and assess the smaller signed-rank total.'},
{t:'Non-parametric',q:'When use Kruskal-Wallis ANOVA?',a:'For three or more <b>independent</b> groups when a one-way parametric ANOVA is unsuitable. It compares rank distributions through the H statistic.'},
{t:'Non-parametric',q:'What does chi-square test?',a:'It compares observed frequencies with expected frequencies. It can test goodness of fit or association/independence in a contingency table; counts, not means, are analysed.'},
{t:'Non-parametric',q:'What is Kendall’s tau?',a:'A rank correlation based on concordant and discordant pairs. It is useful for ordinal rankings and offers an alternative to Spearman’s rho.'},
{t:'Non-parametric',q:'Parametric test-selection cue?',a:'Ask: Is the dependent variable interval/ratio? Is the distribution reasonably normal? Is the design independent or related? Are assumptions such as homogeneity appropriate? If not, consider the non-parametric analogue.'}
];
const themes=['All','Foundations','Distribution','Correlation','Mean differences','Non-parametric'];let active='All',pool=[...cards],i=0;const filters=document.querySelector('#filters');themes.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.className=t===active?'active':'';b.onclick=()=>{active=t;pool=t==='All'?[...cards]:cards.filter(c=>c.t===t);i=0;[...filters.children].forEach(x=>x.classList.toggle('active',x===b));render()};filters.append(b)});function render(){const c=pool[i];document.querySelector('#tag').textContent=c.t;document.querySelector('#q').textContent=c.q;document.querySelector('#a').innerHTML=c.a;document.querySelector('#count').textContent=`Card ${i+1} of ${pool.length} · ${active}`;document.querySelector('#card').classList.remove('flip');document.querySelector('#hint').textContent='Tap to reveal the answer'}function move(n){i=(i+n+pool.length)%pool.length;render()}document.querySelector('#card').onclick=()=>{document.querySelector('#card').classList.toggle('flip');document.querySelector('#hint').textContent=document.querySelector('#card').classList.contains('flip')?'Tap to hide the answer':'Tap to reveal the answer'};document.querySelector('#card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();document.querySelector('#card').click()}};document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);render();
</script></body></html>
