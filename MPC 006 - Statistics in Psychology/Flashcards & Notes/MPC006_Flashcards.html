<script>
const sourceCards=[
{q:'Descriptive versus inferential statistics?',a:`<p><strong>Descriptive statistics</strong> organise, summarise and display the data actually obtained. Frequency tables, graphs, mean, median, mode, range, variance and standard deviation describe the sample without extending the conclusion beyond it.</p><p><strong>Inferential statistics</strong> use a sample statistic to estimate a population parameter or test a population claim. They combine the observed effect with sampling error and express the decision through probability. Estimation, confidence intervals, correlation tests, t tests, ANOVA and chi-square are inferential procedures.</p><p><strong>Example:</strong> the mean anxiety score of 80 students is descriptive. Testing whether that mean differs from a population value, or using it to infer a treatment effect, is inferential.</p><p><strong>Boundary:</strong> inference depends on sampling quality, measurement, assumptions and design. A significant result does not repair a biased sample or prove causation.</p>`},
{q:'What distinguishes parametric from non-parametric statistics?',a:`<p><strong>Parametric tests</strong> make claims about population parameters and usually analyse interval or ratio scores. Common assumptions include independence, an appropriate distributional form, and homogeneity of variance for group comparisons. Examples: Pearson r, t test and ANOVA.</p><p><strong>Non-parametric tests</strong> make fewer distributional assumptions. They commonly analyse ranks, signs or category frequencies and suit nominal or ordinal data, small samples, marked non-normality or serious outliers. Examples: Spearman rho, Mann–Whitney U, Wilcoxon signed-rank, Kruskal–Wallis and chi-square.</p><p><strong>Choice rule:</strong> identify the measurement scale, number of groups, whether observations are independent or related, and whether the question concerns association, difference or frequency.</p><p><strong>Evaluation:</strong> parametric tests often have greater power when their assumptions hold. Non-parametric tests trade some numerical information for wider applicability; they are appropriate alternatives, not inferior versions.</p>`},
{q:'Four levels of measurement?',a:`<ol><li><strong>Nominal:</strong> mutually exclusive categories with no order, such as therapy type or diagnostic group. Summarise with frequencies, percentages and mode; use procedures such as chi-square or phi.</li><li><strong>Ordinal:</strong> ordered categories without known equal gaps, such as ranks or a satisfaction scale. Median, percentiles, Spearman rho and rank tests are suitable.</li><li><strong>Interval:</strong> ordered scores with equal units but no true zero. Celsius temperature and many standardised scores are examples. Differences are meaningful; ratios are not. Mean, SD, Pearson r and parametric tests may be used when assumptions hold.</li><li><strong>Ratio:</strong> interval properties plus an absolute zero, such as reaction time, age or number of errors. All arithmetic operations, including ratios, are meaningful.</li></ol><p>The level of the dependent variable limits which summaries and tests have a defensible interpretation.</p>`},
{q:'Measures of central tendency?',a:`<p>Central tendency locates a distribution’s typical or central score.</p><ul><li><strong>Mean:</strong> <em>M = ΣX/N</em>. It uses every score and supports further algebra, but extreme values and skew can pull it away from the centre.</li><li><strong>Median:</strong> the 50th percentile after ordering the scores. For an even number of scores, average the two middle values. It suits ordinal data, skewed distributions and open-ended classes.</li><li><strong>Mode:</strong> the most frequent value or category. It is the only measure available for nominal data and can reveal more than one peak, but it may be unstable or absent.</li></ul><p><strong>Choice:</strong> use the mean for reasonably symmetric quantitative data, the median when outliers or skew make the mean misleading, and the mode for categories or the most common response. Report dispersion with the chosen centre.</p>`},
{q:'Measures of dispersion?',a:`<p>Dispersion shows how far scores spread around their centre. Two distributions can have the same mean but very different variability.</p><ul><li><strong>Range:</strong> highest minus lowest score. It is quick but depends on only two values and is highly sensitive to extremes.</li><li><strong>Variance:</strong> the average squared deviation from the mean. For a sample, <em>s² = Σ(X − M)²/(n − 1)</em>. Squaring prevents positive and negative deviations from cancelling.</li><li><strong>Standard deviation:</strong> <em>s = √s²</em>. It returns variability to the original unit. A small SD means scores cluster near the mean; a large SD means greater spread.</li><li><strong>Quartile deviation/interquartile range:</strong> uses the middle half of the distribution and resists extreme scores.</li></ul><p>Variance supports inferential calculations, while SD gives the clearest descriptive interpretation. Always interpret variability beside central tendency.</p>`},
{q:'What is a frequency distribution?',a:`<p>A <strong>frequency distribution</strong> arranges scores or categories with the number of observations in each. It converts raw data into a form that reveals concentration, spread, gaps and possible skew.</p><p><strong>Construction:</strong> find the range, choose a suitable number and width of class intervals, make intervals mutually exclusive and exhaustive, tally every observation, and total the frequencies. An ungrouped table lists each score; a grouped table combines scores into class intervals.</p><p><strong>Extensions:</strong> relative frequency gives the proportion or percentage in each class. Cumulative frequency shows the number at or below a boundary and helps locate medians and percentiles.</p><p><strong>Display:</strong> bar diagrams suit separate categories. Histograms and frequency polygons suit continuous grouped scores; an ogive displays cumulative frequency.</p><p>Grouping improves readability but sacrifices exact individual values, so class width should preserve the distribution’s important features.</p>`},
{q:'What is a null hypothesis?',a:`<p>The <strong>null hypothesis (H₀)</strong> states that the population has no difference, effect or association beyond sampling fluctuation. The <strong>alternative hypothesis (H₁)</strong> states the research possibility and may be directional or non-directional.</p><p><strong>Testing sequence:</strong> formulate H₀ and H₁ before inspecting the result; set the significance level α; select a statistic that fits the data and design; calculate the statistic and its probability or critical value; then make the decision.</p><p>If <em>p ≤ α</em>, reject H₀. If <em>p &gt; α</em>, fail to reject H₀. The second decision does not prove that H₀ is true; the study may lack power or precision.</p><p>A statistical decision concerns compatibility with H₀ under stated assumptions. The final answer should translate the decision back to the psychological variables and distinguish statistical significance from practical importance.</p>`},
{q:'Type I and Type II errors?',a:`<p>Hypothesis testing can produce two decision errors.</p><ul><li><strong>Type I error (α):</strong> reject H₀ when H₀ is true, creating a false positive. The chosen significance level controls the long-run risk; α = .05 permits a 5% Type I error rate under repeated valid tests.</li><li><strong>Type II error (β):</strong> fail to reject H₀ when H₀ is false, creating a false negative.</li></ul><p><strong>Power = 1 − β</strong>, the probability of detecting a real effect. Power increases with a larger sample, a larger true effect, reliable measurement and lower error variance.</p><p>Reducing α makes rejection harder and can increase β unless sample size or precision improves. Multiple testing raises the familywise Type I risk. Researchers should plan α, sample size and power before data collection rather than choosing them after seeing the results.</p>`},
{q:'One-tailed versus two-tailed test?',a:`<p>A <strong>one-tailed test</strong> states a directional H₁, such as one treatment producing a higher mean than another. It places the full α rejection region in the predicted tail. This gives more power in that direction but does not support rejection for an equally large result in the opposite direction.</p><p>A <strong>two-tailed test</strong> predicts a difference without specifying direction. It divides α between both tails, such as .025 in each tail when α = .05. It is more conservative for either single direction and suits most exploratory or uncertain predictions.</p><p><strong>Decision rule:</strong> choose the tail from theory and the research hypothesis before examining the data. A researcher must not switch to one-tailed testing after observing the direction. Use a one-tailed test only when the opposite outcome would not count as support for the stated hypothesis.</p>`},
{q:'What is the standard error of the mean?',a:`<p>The <strong>standard error of the mean (SEM)</strong> is the standard deviation of the sampling distribution of sample means. It estimates how much sample means would vary across repeated random samples from the same population.</p><p><strong>Formula:</strong> <em>SEM = σ/√N</em> when population SD is known; in practice, <em>SEM ≈ s/√n</em>. Because n is under a square root, quadrupling sample size halves the SEM.</p><p>A small SEM means the sample mean estimates the population mean with greater precision. It does not describe variability among individual scores; the SD performs that role.</p><p><strong>Uses:</strong> SEM enters t and z tests, the standard error of a mean difference, and confidence intervals. An approximate 95% confidence interval is <em>M ± 1.96 × SEM</em> for large samples under suitable conditions. Larger samples improve precision, but they do not remove bias from poor sampling.</p>`},
{q:'Normal probability curve: key characteristics?',a:`<p>The <strong>normal probability curve</strong> is a theoretical, continuous, bell-shaped distribution defined by its mean μ and standard deviation σ.</p><ul><li>It is symmetrical and unimodal; mean = median = mode at the centre.</li><li>Total area under the curve equals 1.00, with 50% on each side of μ.</li><li>The tails extend indefinitely and approach, but never touch, the baseline.</li><li>Points of inflection occur at approximately μ ± 1σ.</li><li>About 68.26% of scores lie within ±1σ, 95.44% within ±2σ and 99.73% within ±3σ.</li></ul><p>Changing μ shifts the curve; changing σ alters its spread without changing the total area. The curve supplies a probability model for standard scores and many inferential procedures, though observed psychological data may depart from it.</p>`},
{q:'Skewness and kurtosis?',a:`<p><strong>Skewness</strong> describes asymmetry. In a positively skewed distribution the long tail extends right and typically <em>mean &gt; median &gt; mode</em>. In a negatively skewed distribution the tail extends left and typically <em>mean &lt; median &lt; mode</em>. Zero skew indicates symmetry, not necessarily normality.</p><p><strong>Kurtosis</strong> describes tail weight and concentration relative to the normal curve:</p><ul><li><strong>Mesokurtic:</strong> normal reference form.</li><li><strong>Leptokurtic:</strong> more concentrated centre and heavier tails.</li><li><strong>Platykurtic:</strong> flatter centre and lighter tails.</li></ul><p>Skew may result from floor or ceiling effects, extreme scores or the nature of the variable. Marked skew, heavy tails and outliers can affect means, SDs, standard errors and parametric inference. Inspect a graph and descriptive measures before choosing a transformation, robust method or non-parametric test.</p>`},
{q:'Why is normal distribution important?',a:`<p>The normal distribution supplies a common reference for describing scores and making probability statements.</p><ul><li><strong>Relative standing:</strong> convert a raw score to <em>z = (X − μ)/σ</em>; the sign shows direction from the mean and the magnitude shows distance in SD units.</li><li><strong>Probability:</strong> areas under the curve estimate proportions above, below or between scores.</li><li><strong>Sampling theory:</strong> under the central limit theorem, sampling distributions of means approach normality as sample size grows under suitable conditions.</li><li><strong>Inference:</strong> many confidence intervals, significance tests and parametric models use normal or approximately normal sampling distributions.</li></ul><p>Normality is a model, not a rule that every psychological variable obeys. Researchers should inspect skew, outliers and the relevant model residuals. Large samples can stabilise sampling distributions, but they do not correct dependence, biased sampling or unsuitable measurement.</p>`},
{q:'What does Pearson’s product-moment r describe?',a:`<p><strong>Pearson’s r</strong> measures the direction and strength of a linear relationship between two quantitative variables measured in paired observations. It ranges from −1 to +1. The sign gives direction; the absolute value gives strength.</p><p><strong>Logic:</strong> r standardises the variables and compares whether above- and below-mean scores occur together. It can be written conceptually as the average cross-product of paired z scores.</p><p><strong>Procedure:</strong> draw a scatterplot, check paired quantitative data, linearity, influential outliers, homoscedasticity and independence, then calculate and interpret r.</p><p><strong>Coefficient of determination:</strong> <em>r²</em> gives the proportion of variance shared in the fitted linear model. For r = .60, r² = .36, or 36%.</p><p>Correlation does not prove causation. Direction of influence, third variables, range restriction and measurement error remain possible explanations.</p>`},
{q:'Positive, negative and zero correlation?',a:`<ul><li><strong>Positive correlation:</strong> higher scores on one variable tend to accompany higher scores on the other; the scatterplot slopes upward and r &gt; 0.</li><li><strong>Negative correlation:</strong> higher scores on one variable tend to accompany lower scores on the other; the scatterplot slopes downward and r &lt; 0.</li><li><strong>Zero correlation:</strong> r is near 0, so no linear association appears.</li></ul><p>The magnitude, not the sign, indicates strength. Thus r = −.80 is stronger than r = +.30. Values of ±1 indicate perfect linear relations; values between them show imperfect relations.</p><p>A zero Pearson r does not rule out a curved relationship. Always inspect the scatterplot for non-linearity, clusters and outliers. Interpret the coefficient in context, with sample size and uncertainty, and never treat association as evidence that one variable caused the other.</p>`},
{q:'What can distort Pearson r?',a:`<p>Pearson r can misrepresent a relationship when its data conditions are ignored.</p><ul><li><strong>Restricted range:</strong> sampling only a narrow band of scores usually reduces the observed r.</li><li><strong>Outliers:</strong> one influential pair can inflate, reduce or reverse the coefficient.</li><li><strong>Measurement error:</strong> unreliable scores attenuate the observed relation.</li><li><strong>Curvilinearity:</strong> a strong curved pattern can produce r near zero because r measures linear association.</li><li><strong>Heteroscedasticity:</strong> changing spread across X weakens a single linear summary.</li><li><strong>Mixed subgroups:</strong> combining distinct populations can create or hide a relation.</li></ul><p>Inspect the scatterplot, report the sampling range, check data quality and analyse theory-relevant subgroups only when justified. Do not remove an outlier merely to improve r; verify it, explain its influence and use a robust or rank method when appropriate.</p>`},
{q:'When is Spearman’s rho appropriate?',a:`<p><strong>Spearman’s rank-order correlation (ρ or rₛ)</strong> measures the strength and direction of a monotonic association. Use it with ordinal ranks, when quantitative scores are converted to ranks, or when Pearson’s assumptions are unsuitable but the relationship remains monotonic.</p><p><strong>Procedure:</strong> rank both variables, give tied observations their average ranks, calculate each rank difference D, square and sum the differences.</p><p><strong>Formula without ties:</strong> <em>ρ = 1 − [6ΣD² / N(N² − 1)]</em>.</p><p>ρ ranges from −1 to +1. A positive value means ranks rise together; a negative value means one rank falls as the other rises. It detects monotonic curves as well as straight lines, but not arbitrary non-monotonic patterns.</p><p>Spearman uses order rather than original distances, so it resists some outliers but discards interval information. It still requires paired observations and independence between cases.</p>`},
{q:'Point-biserial versus phi coefficient?',a:`<p>Choose the coefficient from the measurement form of both variables.</p><ul><li><strong>Point-biserial correlation (r<sub>pb</sub>):</strong> one quantitative variable and one genuine dichotomy, such as treatment/control with a symptom score. Code the dichotomy 0/1. It is mathematically equivalent to Pearson r and relates closely to the independent-samples t test.</li><li><strong>Phi coefficient (φ):</strong> two genuine dichotomies arranged in a 2 × 2 table, such as pass/fail by treatment/control. It is related to chi-square through <em>φ = √(χ²/N)</em> for a 2 × 2 table.</li></ul><p>Both range from −1 to +1 with suitable coding, though the attainable phi range can depend on unequal marginal frequencies. Do not create artificial dichotomies from continuous scores merely to use these coefficients; dichotomising discards information and may weaken the relation.</p>`},
{q:'Partial, part and multiple correlation?',a:`<p><strong>Partial correlation</strong> estimates the X–Y association after removing a control variable Z from both X and Y. For one control, <em>r<sub>xy.z</sub> = (r<sub>xy</sub> − r<sub>xz</sub>r<sub>yz</sub>)/√[(1 − r²<sub>xz</sub>)(1 − r²<sub>yz</sub>)]</em>.</p><p><strong>Part or semipartial correlation</strong> removes Z from only one variable, usually a predictor. Its squared value shows the predictor’s unique addition to explained criterion variance.</p><p><strong>Multiple correlation (R)</strong> relates one criterion to the best linear combination of two or more predictors. R ranges from 0 to 1; R² gives their combined explained variance.</p><p>These methods clarify statistical overlap but do not experimentally control Z or prove causation. Results depend on reliable measurement, linearity, the selected control variables and adequate sample size. A poorly justified control can remove meaningful variance or introduce bias.</p>`},
{q:'What is regression?',a:`<p><strong>Regression</strong> predicts a criterion variable Y from one or more predictors X. Simple linear regression fits the least-squares line <em>Ŷ = a + bX</em>, where b is the slope and a is the intercept. For one predictor, <em>b = r(s<sub>Y</sub>/s<sub>X</sub>)</em> and <em>a = M<sub>Y</sub> − bM<sub>X</sub></em>.</p><p>The <strong>residual</strong> is observed Y minus predicted Ŷ. Least squares chooses the line that minimises the sum of squared residuals. R² reports the proportion of criterion variance explained by the model.</p><p><strong>Checks:</strong> linearity, independent errors, constant residual variance, influential observations and approximately normal residuals for inference. Multiple regression adds predictors and estimates each predictor’s unique contribution while holding the others constant.</p><p>Prediction does not prove causation. Avoid extrapolating beyond the observed X range, and validate the equation on new data when prediction is the goal.</p>`},
{q:'When is a t test used?',a:`<p>A <strong>t test</strong> evaluates whether a mean difference is large relative to its estimated sampling error.</p><ul><li><strong>One-sample t:</strong> compares one sample mean with a specified population value; df = n − 1.</li><li><strong>Independent-samples t:</strong> compares two separate groups; under the pooled-variance form, df = n₁ + n₂ − 2.</li><li><strong>Paired-samples t:</strong> compares related observations, such as pre–post scores, by testing the mean difference; df = n − 1 pairs.</li></ul><p><strong>Logic:</strong> <em>t = observed mean difference / standard error of the difference</em>. State H₀/H₁, choose α, calculate t and df, compare p or the critical value, and interpret the decision in context.</p><p>Assumptions include independent cases, quantitative scores and suitable normality of scores or paired differences. Report the direction, confidence interval and an effect size such as Cohen’s d, not significance alone.</p>`},
{q:'What is one-way ANOVA?',a:`<p><strong>One-way ANOVA</strong> compares the means of three or more independent groups defined by one factor. H₀ states that all population means are equal. It avoids the inflated Type I error produced by running many separate t tests.</p><p><strong>Variance logic:</strong> total variability is partitioned into between-group and within-group components. Divide each sum of squares by its degrees of freedom to obtain mean squares. <em>F = MS<sub>between</sub>/MS<sub>within</sub></em>; a large F means group separation is large relative to error variation.</p><p><strong>Degrees of freedom:</strong> between = k − 1; within = N − k.</p><p>A significant F shows that at least one mean differs, not which one. Use planned contrasts or post-hoc tests for location, and report an effect size such as η² = SS<sub>between</sub>/SS<sub>total</sub>.</p><p>Assumptions: independent observations, suitable quantitative outcome, approximate within-group normality and homogeneity of variance.</p>`},
{q:'What is two-way ANOVA?',a:`<p><strong>Two-way ANOVA</strong> studies two factors in one factorial design. Each combination of factor levels forms a cell. For example, therapy type × gender creates cell means for every therapy–gender combination.</p><p>It tests three effects:</p><ol><li><strong>Main effect of A:</strong> mean differences across levels of A, averaging over B.</li><li><strong>Main effect of B:</strong> mean differences across levels of B, averaging over A.</li><li><strong>A × B interaction:</strong> the effect of A changes across levels of B.</li></ol><p>An interaction is interpreted from the pattern of cell means or an interaction plot. Crossing or non-parallel lines suggest dependency between factors. When interaction is meaningful, examine simple effects rather than discussing main effects in isolation.</p><p>The model retains the usual ANOVA conditions of independent observations, suitable outcome scale, approximate within-cell normality and homogeneity of variance. Report each F, df, p and effect size.</p>`},
{q:'What are degrees of freedom?',a:`<p><strong>Degrees of freedom (df)</strong> are the number of independent pieces of information available after estimating parameters or imposing constraints. If n deviations must sum to zero after estimating the mean, only n − 1 can vary freely.</p><p>Common formulas:</p><ul><li>One-sample or paired t: <em>df = n − 1</em>.</li><li>Pooled independent t: <em>df = n₁ + n₂ − 2</em>.</li><li>One-way ANOVA: <em>df<sub>between</sub> = k − 1</em>; <em>df<sub>within</sub> = N − k</em>.</li><li>Chi-square independence: <em>df = (r − 1)(c − 1)</em>.</li><li>Chi-square goodness of fit: usually <em>df = k − 1</em>, adjusted for estimated parameters.</li></ul><p>Degrees of freedom determine the reference distribution and critical value. As df increases, t distributions approach the normal distribution and estimates generally become more stable.</p>`},
{q:'When use Mann-Whitney U?',a:`<p>The <strong>Mann–Whitney U test</strong> compares two independent groups using ranks. Use it for ordinal outcomes or when an independent-samples t test is unsuitable because its data conditions are not defensible.</p><p><strong>Procedure:</strong> combine both groups, rank all observations from lowest to highest, assign average ranks to ties, calculate each group’s rank sum, then obtain U. For group 1, <em>U₁ = n₁n₂ + n₁(n₁ + 1)/2 − R₁</em>; calculate U₂ similarly and use the smaller value for the usual critical-value method.</p><p>H₀ states that the groups come from the same distribution. With similarly shaped distributions, the result is often interpreted as a location or median difference; without that condition, it is a broader distributional comparison.</p><p>Cases must be independent and the outcome at least ordinal. Report U, sample sizes, p, direction from rank sums, and an effect size where possible.</p>`},
{q:'When use Wilcoxon matched-pairs signed-rank?',a:`<p>The <strong>Wilcoxon signed-rank test</strong> compares two related measurements, such as pre–post scores or matched pairs, when the paired-samples t test is unsuitable. It tests whether paired differences centre on zero while using both direction and magnitude through ranks.</p><p><strong>Procedure:</strong> calculate each paired difference; remove zero differences; rank the absolute differences from smallest to largest; assign average ranks to ties; restore each sign; sum positive and negative ranks. The smaller signed-rank total forms the usual test statistic.</p><p>Observations must be paired and pairs independent of other pairs. The outcome should be at least ordinal, and the difference distribution should be reasonably symmetric for a median-shift interpretation.</p><p>Wilcoxon differs from the simple sign test because it uses ranked magnitudes as well as signs, which usually gives greater power. Report the statistic, effective n, p, direction and effect size.</p>`},
{q:'When use Kruskal-Wallis ANOVA?',a:`<p>The <strong>Kruskal–Wallis H test</strong> compares three or more independent groups using ranks. It is the non-parametric alternative to one-way independent-groups ANOVA for ordinal data or unsuitable parametric conditions.</p><p><strong>Procedure:</strong> pool all N observations, rank them, give ties average ranks, find each group’s rank sum R<sub>j</sub>, and calculate <em>H = [12/N(N + 1)]Σ(R²<sub>j</sub>/n<sub>j</sub>) − 3(N + 1)</em>, with a tie correction when needed.</p><p>For adequate samples, H is compared with chi-square using <em>df = k − 1</em>. A significant result means the group distributions are not all alike. It does not identify the differing groups; use adjusted pairwise rank comparisons.</p><p>Cases must be independent and the outcome at least ordinal. A median-difference interpretation requires similarly shaped group distributions.</p>`},
{q:'What does chi-square test?',a:`<p><strong>Chi-square (χ²)</strong> compares observed category frequencies O with frequencies expected E under H₀. Its core formula is <em>χ² = Σ[(O − E)²/E]</em>.</p><ul><li><strong>Goodness of fit:</strong> asks whether one categorical distribution matches specified proportions; expected counts come from those proportions.</li><li><strong>Test of independence:</strong> asks whether two categorical variables are associated in a contingency table; <em>E = row total × column total / grand total</em>.</li></ul><p>Use counts, not percentages, means or repeated measurements. Categories must be mutually exclusive, cases independent and expected counts adequate; combine defensible categories or use an exact method when sparse cells make the approximation poor.</p><p>For independence, <em>df = (r − 1)(c − 1)</em>. A significant χ² identifies departure from independence, not its location or strength. Inspect cell residuals and report an effect size such as phi for 2 × 2 tables or Cramér’s V for larger tables.</p>`},
{q:'What is Kendall’s tau?',a:`<p><strong>Kendall’s tau</strong> measures ordinal association by comparing every possible pair of cases. A pair is <strong>concordant</strong> when both variables order it in the same direction and <strong>discordant</strong> when the directions disagree.</p><p>Without ties, <em>τ = (C − D)/[n(n − 1)/2]</em>, where C and D are concordant and discordant pairs. Tau-b adjusts the denominator for tied ranks. Values range from −1 to +1.</p><p>Use Kendall tau for ranked or ordinal data, especially with small samples, many tied ranks or when a pairwise probability interpretation is helpful. Its magnitude is often lower than Spearman rho for the same data because the scales differ.</p><p>A positive tau means concordant orderings predominate; a negative tau means discordant orderings predominate. Like every correlation, it describes association, not causation, and requires paired observations with independent cases.</p>`},
{q:'Parametric test-selection cue?',a:`<p>Select a test from the research question, measurement and design:</p><ul><li><strong>Two independent means:</strong> independent t; use Mann–Whitney U for ordinal/rank data or unsuitable parametric conditions.</li><li><strong>Two related means:</strong> paired t; use Wilcoxon signed-rank for a rank-based alternative.</li><li><strong>Three or more independent groups:</strong> one-way ANOVA; use Kruskal–Wallis for ranks.</li><li><strong>Two quantitative variables:</strong> Pearson r for linear association; Spearman rho or Kendall tau for ordinal or monotonic rank association.</li><li><strong>Categorical frequencies:</strong> chi-square; use phi for association in a 2 × 2 table.</li></ul><p>Before deciding, check the dependent variable’s scale, number of groups, independence or pairing, distribution shape, outliers, variance conditions and sample size. Then state H₀, α and the planned interpretation. Choose the method before examining which result becomes significant.</p>`}
];

const cards=sourceCards.map((card,index)=>{
  const meta=cardMeta[index];
  const tags=meta.terms.map(term=>`<span class="tag">${term}</span>`).join('');
  return {...meta,front:card.q,back:`<p>${card.a}</p><div class="key-terms"><div class="key-terms-title">Key terms for marks</div>${tags}</div>`};
});

let currentIndex=0,filteredCards=[...cards],isShuffled=false,cardFlipped=false;
const flashcard=document.getElementById('flashcard');
const progressBar=document.querySelector('.progress-bar');
const prevButton=document.getElementById('prevButton');
const nextButton=document.getElementById('nextButton');

function renderCard(){
  const card=filteredCards[currentIndex];
  if(!card)return;
  const marksClass=card.marks>=10?'marks-high':card.marks>=6?'marks-med':'marks-low';
  const tierClass=card.tier==='TIER 1'?'tier-1':card.tier==='TIER 2'?'tier-2':'tier-3';
  const badge=`<div class="marks-badge ${marksClass}">Likely ${card.marks} Marks <span class="tier-badge ${tierClass}">${card.tier}</span></div>`;
  document.getElementById('cardFront').innerHTML=`<div class="card-label">${getThemeLabel(card.theme)}</div><div class="card-title">${card.title}</div>${badge}<div class="card-body"><p>${card.front}</p></div>`;
  document.getElementById('cardBack').innerHTML=`<div class="card-label back-label">Answer</div><div class="card-title">${card.title}</div>${badge}<div class="card-body">${card.back}</div>`;
  document.getElementById('currentNum').textContent=currentIndex+1;
  document.getElementById('totalNum').textContent=filteredCards.length;
  document.getElementById('progressFill').style.width=((currentIndex+1)/filteredCards.length*100)+'%';
  progressBar.setAttribute('aria-valuemax',filteredCards.length);
  progressBar.setAttribute('aria-valuenow',currentIndex+1);
  prevButton.disabled=currentIndex===0;
  nextButton.disabled=currentIndex===filteredCards.length-1;
  cardFlipped=false;
  flashcard.classList.remove('flipped');
  flashcard.setAttribute('aria-pressed','false');
  document.getElementById('flipHint').textContent='Click card to flip';
  document.getElementById('cardFront').scrollTop=0;
  document.getElementById('cardBack').scrollTop=0;
}

function getThemeLabel(theme){
  const labels={foundations:'Foundations & Inference',distribution:'Normal Distribution',correlation:'Correlation & Regression',differences:'Mean Differences & ANOVA',nonparametric:'Non-parametric Tests'};
  return labels[theme]||theme;
}

function flipCard(){
  cardFlipped=!cardFlipped;
  flashcard.classList.toggle('flipped',cardFlipped);
  flashcard.setAttribute('aria-pressed',String(cardFlipped));
  document.getElementById('flipHint').textContent=cardFlipped?'Click card to show question':'Click card to flip';
}

function nextCard(){if(currentIndex<filteredCards.length-1){currentIndex++;renderCard();}}
function prevCard(){if(currentIndex>0){currentIndex--;renderCard();}}
function resetCard(){cardFlipped=false;flashcard.classList.remove('flipped');flashcard.setAttribute('aria-pressed','false');document.getElementById('flipHint').textContent='Click card to flip';}

function toggleShuffle(){
  isShuffled=!isShuffled;
  document.getElementById('shuffleIndicator').classList.toggle('active',isShuffled);
  if(isShuffled)filteredCards=[...filteredCards].sort(()=>Math.random()-.5);
  else applyFilter();
  currentIndex=0;
  renderCard();
}

function applyFilter(){
  const theme=document.getElementById('themeFilter').value;
  filteredCards=theme==='all'?[...cards]:cards.filter(card=>card.theme===theme);
  if(isShuffled)filteredCards=[...filteredCards].sort(()=>Math.random()-.5);
  currentIndex=0;
  renderCard();
}

document.getElementById('themeFilter').addEventListener('change',()=>{isShuffled=false;document.getElementById('shuffleIndicator').classList.remove('active');applyFilter();});
document.getElementById('shuffleButton').addEventListener('click',toggleShuffle);
document.getElementById('resetButton').addEventListener('click',resetCard);
prevButton.addEventListener('click',prevCard);
nextButton.addEventListener('click',nextCard);
flashcard.addEventListener('click',flipCard);
flashcard.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();flipCard();}});
document.addEventListener('keydown',event=>{
  if(event.target.matches('select,button'))return;
  if(event.key==='ArrowRight')nextCard();
  else if(event.key==='ArrowLeft')prevCard();
  else if(event.key==='s'||event.key==='S')toggleShuffle();
});

renderCard();
</script>
